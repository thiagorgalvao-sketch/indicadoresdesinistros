<style>
  :root {
    /* escala tipográfica consolidada — 8 degraus deliberados em vez de ~23 tamanhos ad-hoc */
    --fs-xs: 11px;
    --fs-sm: 12px;
    --fs-base: 13px;
    --fs-md: 15px;
    --fs-lg: 17px;
    --fs-xl: 21px;
    --fs-xxl: 26px;
    --fs-xxxl: 34px;
    --color-navy: #0B2A4A;
    --color-navy-2: #123F6E;
    --color-teal: #1C6E8C;
    --color-blue: #2E86C1;
    --color-lightblue: #5DADE2;
    --color-green: #1F8A5F;
    --color-green-bg: #E7F5EE;
    --color-amber: #E8A33D;
    --color-amber-bg: #FCF0E0;
    --color-coral: #E15241;
    --color-coral-bg: #FBEAEA;
    --color-gray: #A6ACAF;

    --color-bg: #F4F7FB;
    --color-panel: #FFFFFF;
    --color-fg: #16283C;
    --color-fg-muted: #5B6B76;
    --color-border-line: #E1E8EF;
    --color-accent-strong: #0B2A4A;
    --card-shadow: 0 1px 2px rgba(11,42,74,0.05), 0 2px 10px rgba(11,42,74,0.07);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --color-bg: #0E1620;
      --color-panel: #16202C;
      --color-fg: #EAF1F8;
      --color-fg-muted: #93A5B5;
      --color-border-line: #263240;
      --color-accent-strong: #BFD8F2;
      --card-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 4px 14px rgba(0,0,0,0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --color-bg: #0E1620;
    --color-panel: #16202C;
    --color-fg: #EAF1F8;
    --color-fg-muted: #93A5B5;
    --color-border-line: #263240;
    --color-accent-strong: #BFD8F2;
    --card-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 4px 14px rgba(0,0,0,0.35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  .ico { display: inline-flex; align-items: center; justify-content: center; vertical-align: -0.125em; }
  .ico svg { display: block; }
  @keyframes contentFadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  .content-fade-in { animation: contentFadeIn .32s cubic-bezier(.22,1.1,.36,1); }
  @media (prefers-reduced-motion: reduce) { .content-fade-in { animation: none; } }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background-color: var(--color-bg);
    background-image:
      repeating-linear-gradient(135deg, rgba(43,150,229,0.035) 0px, rgba(43,150,229,0.035) 1px, transparent 1px, transparent 46px),
      repeating-linear-gradient(45deg, rgba(11,42,74,0.03) 0px, rgba(11,42,74,0.03) 1px, transparent 1px, transparent 46px);
    background-attachment: fixed;
    color: var(--color-fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  body {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #app { max-width: 1180px; margin: 0 auto; padding: 24px 20px 60px; }
  #app.presenting { max-width: 1400px; }

  header.top {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; margin-bottom: 20px; flex-wrap: wrap;
  }
  header.top h1 { font-size: var(--fs-xl); margin: 0; color: var(--color-fg); }
  header.top p { margin: 2px 0 0; color: var(--color-fg-muted); font-size: var(--fs-sm); }
  .last-update { margin: 6px 0 0; font-size: var(--fs-sm); color: var(--color-fg-muted); display: flex; align-items: center; gap: 6px; }
  .last-update .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--color-green); display: inline-block; }
  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .header-btns { display: flex; gap: 8px; }
  .brand-logos { display: flex; align-items: center; gap: 16px; }
  .logo-badge { height: 30px; width: auto; display: block; }
  .logo-chip { background: #FFFFFF; border-radius: 8px; padding: 6px 10px; display: flex; align-items: center; }
  .logo-chip .logo-badge { height: 26px; }
  /* logo Alper Cargo (fora do chip branco do Lecom) some no fundo escuro — vira silhueta

  /* Segmented control "de verdade": uma cápsula com fundo neutro e um indicador que desliza

     significado (azul/âmbar/verde) fica no TEXTO do item ativo, não no fundo que desliza. */

    transition: left .32s cubic-bezier(.34,1.56,.64,1), width .32s cubic-bezier(.34,1.56,.64,1), top .32s ease;
    z-index: 0; pointer-events: none; opacity: 0;

  .export-header { display: none; }

  .export-header .logos img { height: 26px; }

  ::placeholder { color: var(--color-fg-muted); opacity: .7; }

  .active-filter-chip {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;

  }
  .active-filter-chip button:hover { background: rgba(255,255,255,.3); }
  .detail-table-card { margin-bottom: 20px; }
  .detail-table-empty { font-size: var(--fs-sm); color: var(--color-fg-muted); padding: 4px; }
  table.detail-table { width: 100%; min-width: 700px; border-collapse: collapse; font-size: var(--fs-sm); }
  table.detail-table th {
    text-align: left; padding: 8px 10px; font-size: var(--fs-xs); font-weight: 700; color: var(--color-fg-muted);
    text-transform: uppercase; letter-spacing: .02em; border-bottom: 2px solid var(--color-border-line); white-space: nowrap;
  }
  table.detail-table th.sortable-th { cursor: pointer; user-select: none; }
  table.detail-table th.sortable-th:hover { color: var(--color-fg); }
  table.detail-table td { padding: 8px 10px; border-bottom: 1px solid var(--color-border-line); color: var(--color-fg); white-space: nowrap; }
  .detail-processo-link { color: var(--color-blue); text-decoration: underline; font-weight: 600; }
  .detail-processo-link:hover { opacity: .75; }
  table.detail-table tr:last-child td { border-bottom: none; }
  table.detail-table tr:hover td { background: var(--color-bg); }
  .detail-table-note { font-size: var(--fs-xs); color: var(--color-fg-muted); margin-top: 8px; font-style: italic; }
  .detail-table-pagination {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    margin-top: 10px; font-size: var(--fs-xs); color: var(--color-fg-muted);
  }
  .detail-page-btns { display: flex; align-items: center; gap: 10px; }
  .detail-page-label { font-size: var(--fs-xs); color: var(--color-fg-muted); white-space: nowrap; }
  .detail-page-btns button.secondary { padding: 5px 12px; font-size: var(--fs-xs); }
  .detail-page-btns button.secondary:disabled { opacity: .4; cursor: default; }
  .chart-card .hint-click { font-size: var(--fs-xs); color: var(--color-fg-muted); font-weight: 500; margin-left: 6px; }
  .clickable-el { cursor: pointer; }
  .clickable-el:hover { opacity: .82; }

  /* ---------- responsividade para celular ---------- */
  @media (max-width: 600px) {
    #app { padding: 16px 12px 50px; }
    header.top h1 { font-size: var(--fs-lg); }
    header.top p { font-size: var(--fs-sm); }
    .header-right { align-items: flex-start; width: 100%; order: -1; margin-bottom: 10px; }
    .brand-logos { gap: 10px; }
    .logo-badge { height: 24px; }
    .logo-chip .logo-badge { height: 20px; }
    .header-btns { width: 100%; }
    .header-btns .icon-btn { flex: 1; justify-content: center; }

    .toolbar-row { flex-direction: column; align-items: stretch; }
    .toolbar-left { width: 100%; flex-direction: column; align-items: stretch; gap: 10px; }
    .filter-group, .compare-group { width: 100%; }
    .filter-group input[type="date"] { flex: 1; min-width: 0; }
    .compare-group select { flex: 1; min-width: 0; }
    .toolbar-right { margin-left: 0; width: 100%; }
    .toolbar-right button { flex: 1; }

    .chart-card-head { flex-direction: column; align-items: flex-start; }
    .seg-group { width: 100%; }
    .seg-btn { flex: 1; font-size: var(--fs-xs); padding: 8px 4px; text-align: center; }

    .kpi-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .kpi { padding: 12px 14px; gap: 8px; }
    .kpi-icon { font-size: var(--fs-xl); }
    .kpi .value { font-size: var(--fs-xl); }
    .kpi .label { font-size: var(--fs-xs); }
    .kpi .delta { font-size: var(--fs-xs); flex-wrap: wrap; }

    .summary-banner, .alert-banner, .stale-banner, .active-filter-chip { font-size: var(--fs-sm); padding: 12px 14px; }

    .del-btn { padding: 9px 10px; font-size: var(--fs-md); }
    table.history th, table.history td { padding: 8px 6px; }

    .export-header .row { flex-direction: column; align-items: flex-start; }
    .upload-row { flex-direction: column; align-items: stretch; }
    .upload-row input[type="text"] { min-width: 0; }
  }
  @media (max-width: 400px) {
    .kpi-grid { grid-template-columns: 1fr; }
  }

<body>
<div id="app">
  <div class="export-header" id="exportHeader">
    <div class="row">
      <div>
        <h2>Workflow de Sinistros — Relatório de Indicadores</h2>
        <div class="meta" id="exportMeta"></div>
      </div>
      <div class="logos">
        <img src="/_blob/f5ac5fc5c563fa2c54921ffa166d8dc7" alt="Alper Cargo" />

      <p>Indicadores da operação, para acompanhamento durante produção assistida.</p>

    <div class="header-right">

    <button type="button" class="tab-btn" data-tab="case">MÉTRICAS-CHAVE DO CASE</button>
  </div>

    <div class="seg-group" id="caseDateGroup">
      <button type="button" class="seg-btn seg-neutral" data-mode="tudo">Toda a base (Quiver + Lecom)</button>
      <button type="button" class="seg-btn seg-neutral" data-mode="antes">Base QUIVER</button>
      <button type="button" class="seg-btn seg-neutral" data-mode="golive">Base LECOM</button>
    </div>

  <div class="toolbar-row" id="toolbarRow" style="display:none;">

        <label for="dateFilter">Data de abertura até:</label>
        <input type="date" id="dateFilter" />

      </div>

        <label for="compareSelect">Comparar com:</label>

          <option value="1d">Dia anterior</option>
          <option value="7d">Semana anterior</option>
          <option value="30d">Mês anterior</option>
          <option value="365d">Ano anterior</option>
        </select>
        <span class="info-dot" id="compareInfo" data-tip="A data informada acima define o corte 'atual'. Este seletor subtrai 1 dia, 7 dias, 1 mês ou 1 ano dessa data para definir o corte 'anterior'. Os dois cortes usam sempre a data de Abertura do sinistro, nunca a data em que os dados foram atualizados.">?</span>
      </div>
    </div>
    <div class="toolbar-right">

  </div>

      <button class="primary" id="processBtn" disabled>Processar e salvar</button>
    </div>
    <div class="status-msg" id="statusMsg"></div>
  </div>
</div>

  function makeSupabaseDbShim(client) {

            uploaded_at: payload.uploadedAt,

            if (res.error) throw res.error;

                    .limit(n)
                    .then(function (res) {
                      if (res.error) throw res.error;

                      return {
                        empty: rows.length === 0,
                        docs: rows.map(function (row) {
                          return { id: row.id, data: function () { return row.data; } };
                        })
                      };
                    });
                }
              };
            }
          };
        },
        doc: function (id) {
          return {
            delete: function () {
              return client.from(name).delete().eq("id", id).then(function (res) {
                if (res.error) throw res.error;
              });
            }
          };
        }
      };

      return;
    }
    var originalText = exportBtn.innerHTML;

    // histórico já ficam ocultos por aquele modo) — só trocamos o cabeçalho pelo
    // de relatório e forçamos o tema claro, que são específicos do PDF.
    var wasPresenting = appEl.classList.contains("presenting");
    if (!wasPresenting) appEl.classList.add("presenting");

    liveHeader.style.display = "none";
    var wasShowingAll = showAllRegulators;
    showAllRegulators = true;
    drawRegulatorChart();
    var wasShowingAllAnalysts = showAllAnalysts;
    showAllAnalysts = true;
    drawAnalystChart();

    var htmlEl = document.documentElement;
    var hadThemeAttr = htmlEl.hasAttribute("data-theme");
    var prevThemeAttr = htmlEl.getAttribute("data-theme");

    var cutoffTxt = dateFilter.value ? new Date(dateFilter.value + "T12:00:00").toLocaleDateString("pt-BR") : "—";
    exportMeta.textContent = "Dados com abertura até " + cutoffTxt + "  •  Gerado em " + genAt;

    function restore() {
      liveHeader.style.display = "";

      showAllRegulators = wasShowingAll;
      drawRegulatorChart();
      showAllAnalysts = wasShowingAllAnalysts;

    setTimeout(function () {
      var target = document.getElementById("app");
      var scale = 2;

      html2canvas(target, { scale: scale, backgroundColor: "#F4F7FB", useCORS: true }).then(function (canvas) {
        var jsPDF = window.jspdf.jsPDF;
        // página única contínua: a altura do "papel" acompanha o conteúdo inteiro,
        // então não há quebra de página nem risco de cortar um card ao meio.
        var pageWidthPt = 595.28; // largura A4 em pontos, mantida por familiaridade
        var pxPerPt = canvas.width / pageWidthPt;
        var pageHeightPt = canvas.height / pxPerPt;

        var imgData = canvas.toDataURL("image/png");
        pdf.addImage(imgData, "PNG", 0, 0, pageWidthPt, pageHeightPt);

        var blob = pdf.output("blob");
        restore();

        var now = new Date();
        var pad2 = function (n) { return String(n).padStart(2, "0"); };
        var dataFmt = pad2(now.getDate()) + "-" + pad2(now.getMonth() + 1) + "-" + now.getFullYear();

  function doSave(indicators, label, db) {
    var uploadedAt = new Date().toISOString();
    // dados de detalhe (clique para listar processos) vão num documento SEPARADO do
    // snapshot principal — numa tentativa anterior, juntar tudo num só documento estourou
    // o limite de armazenamento. O painel principal continua pequeno e sempre confiável;
    // se o documento de detalhe falhar ao salvar, só a tabela de processos fica indisponível
    // pra esse snapshot, o resto do painel funciona normalmente.
    var detailRows = indicators.detailRows;
    var clienteIndex = indicators.clienteIndex;
    var seguradoraIndex = indicators.seguradoraIndex;
    var mainPayload = Object.assign({}, indicators, {
      label: label,
      uploadedAt: uploadedAt,
    });
    delete mainPayload.detailRows;
    delete mainPayload.clienteIndex;
    delete mainPayload.seguradoraIndex;

    db.collection("snapshots").add(mainPayload).then(function (mainDoc) {
      var detailPayload = {
        mainSnapshotId: mainDoc && mainDoc.id,
        uploadedAt: uploadedAt,
        detailRows: detailRows,
        clienteIndex: clienteIndex,
        seguradoraIndex: seguradoraIndex,
      };
      // espera o documento de detalhe terminar de salvar (sucesso ou falha) ANTES de
      // recarregar — chamar loadAndRender antes disso criava uma corrida: a releitura
      // podia rodar antes do documento de detalhe existir de verdade no banco, fazendo
      // a tabela aparecer como "não disponível" mesmo quando o salvamento ia dar certo.
      return db.collection("snapshot_details").add(detailPayload).catch(function (err) {
        console.error("[detalhe] ERRO ao salvar os dados de detalhe (tabela de processos ficará indisponível para este snapshot):", err);
      }).then(function () {
        setStatus(icoSpan("check") + " Snapshot \"" + label + "\" salvo e painel atualizado.", "ok");
        uploadCard.classList.add("collapsed");
        dateFilter.value = ""; // volta a usar a data de abertura mais recente do novo upload
        loadAndRender(db);
      });
    }).catch(function (err) {
      setStatus("Erro ao salvar: " + (err && err.message ? err.message : err), "err");
      processBtn.disabled = false;
    });
  }

  function processAndSave() {
    if (!pendingRows) return;

    var indicators;

      indicators = computeIndicators(pendingRows);

        allDocs = [{ id: "local", data: indicators }];

        setupDateFilterRange();
        renderDashboard();

      // validação: alerta se o novo upload tem bem menos linhas que o anterior (possível export incompleto)
      var prevTotal = allDocs.length ? allDocs[0].data.total : null;
      if (prevTotal && indicators.total < prevTotal * 0.8) {

          ' <button type="button" class="secondary" id="confirmSaveBtn" style="padding:3px 10px; font-size: var(--fs-xs); margin-left:6px;">Salvar mesmo assim</button>' +
          ' <button type="button" class="secondary" id="cancelSaveBtn" style="padding:3px 10px; font-size: var(--fs-xs);">Cancelar</button>';
        document.getElementById("confirmSaveBtn").addEventListener("click", function () {
          setStatus("Salvando…", "");

        });
        document.getElementById("cancelSaveBtn").addEventListener("click", function () {
          setStatus("Upload cancelado — confira se o export da planilha está completo.", "warn");
          processBtn.disabled = false;
        });
        return;
      }
      doSave(indicators, label, db);
    }).catch(function (err) {
      setStatus("Erro inesperado ao acessar o armazenamento: " + (err && err.message ? err.message : err), "err");
      processBtn.disabled = false;
    });

  function pickSheet(wb) {
    var names = wb.SheetNames || [];
    var byName = names.find(function (n) { return n.trim().toLowerCase() === "lista"; });
    if (byName) return wb.Sheets[byName];
    for (var i = 0; i < names.length; i++) {
      var sh = wb.Sheets[names[i]];
      var json = XLSX.utils.sheet_to_json(sh, { header: 1, range: 0 });
      if (json && json[0] && json[0].some(function (h) { return String(h).trim() === "Status do Processo"; })) {
        return sh;
      }
    }
    return names.length ? wb.Sheets[names[0]] : null;
  }

  function norm(v) { return (v === null || v === undefined) ? "" : String(v).trim(); }

  function daysSinceEpoch(d) { return Math.floor(d.getTime() / 86400000); }
  function dateFromDays(days) { return new Date(days * 86400000); }
  function daysBack(date, n) { var d = new Date(date); d.setDate(d.getDate() - n); return d; }
  function monthsBack(date, n) { var d = new Date(date); d.setMonth(d.getMonth() - n); return d; }

  // Lê a planilha completa e, além dos totais gerais (para compatibilidade e referência),
  // guarda uma versão compacta linha-a-linha (rowData) para permitir recalcular os
  // indicadores em QUALQUER data de corte, sempre usando a data de ABERTURA do sinistro.
  function computeIndicators(rows) {
    var SEM_CORRESPONDENCIA = "SEM CORRESPONDÊNCIA DIRETA";
    var regIndex = [];
    var regMap = {};
    function regIdxFor(name) {
      if (Object.prototype.hasOwnProperty.call(regMap, name)) return regMap[name];
      var idx = regIndex.length;
      regIndex.push(name);
      regMap[name] = idx;
      return idx;
    }
    var analystIndex = [];
    var analystMap = {};
    function analystIdxFor(name) {
      if (Object.prototype.hasOwnProperty.call(analystMap, name)) return analystMap[name];
      var idx = analystIndex.length;
      analystIndex.push(name);
      analystMap[name] = idx;
      return idx;
    }
    var gerenteIndex = [];
    var gerenteMap = {};
    function gerenteIdxFor(name) {
      if (Object.prototype.hasOwnProperty.call(gerenteMap, name)) return gerenteMap[name];
      var idx = gerenteIndex.length;
      gerenteIndex.push(name);
      gerenteMap[name] = idx;
      return idx;
    }
    var etapaIndex = [];
    var etapaMap = {};
    function etapaIdxFor(name) {
      if (Object.prototype.hasOwnProperty.call(etapaMap, name)) return etapaMap[name];
      var idx = etapaIndex.length;
      etapaIndex.push(name);
      etapaMap[name] = idx;
      return idx;
    }
    // Seguradora e Cliente (CNPJ + Razão Social) — catalogos deduplicados, só usados pela
    // tabela de detalhe (clique para listar processos). Ficam num documento SEPARADO do
    // snapshot principal (ver saveDetailData), pra não repetir o problema de armazenamento
    // de uma tentativa anterior.
    var seguradoraIndex = [];
    var seguradoraMap = {};
    function seguradoraIdxFor(name) {
      if (Object.prototype.hasOwnProperty.call(seguradoraMap, name)) return seguradoraMap[name];
      var idx = seguradoraIndex.length;
      seguradoraIndex.push(name);
      seguradoraMap[name] = idx;
      return idx;
    }
    var clienteIndex = [];
    var clienteMap = {};
    function clienteIdxFor(cnpj, razaoSocial) {
      var key = cnpj + "|" + razaoSocial;
      if (Object.prototype.hasOwnProperty.call(clienteMap, key)) return clienteMap[key];
      var idx = clienteIndex.length;
      clienteIndex.push([cnpj, razaoSocial]);
      clienteMap[key] = idx;
      return idx;
    }

    var rowData = [];
    var detailRows = []; // alinhado por índice com rowData (ver rowIdx no final de cada linha)
    var maxAbertura = null;
    var totalSemAbertura = 0;

    rows.forEach(function (r) {
      var origemRaw = norm(r["Origem do Sinistro"]);
      var origemUpper = origemRaw.toUpperCase();
      var status = norm(r["Status do Processo"]);
      var reguladoraRaw = norm(r["Reguladora"]);

      // A coluna "Origem do Sinistro" já teve dois formatos diferentes:
      // (1) formato antigo — traz o texto genérico "API", e o nome da reguladora
      //     vem separado na coluna "Reguladora";
      // (2) formato novo — traz o NOME DA REGULADORA diretamente, e a coluna
      //     "Reguladora" fica em branco para esses registros.
      // A lógica abaixo reconhece os dois formatos sem quebrar nenhum deles.
      var origemCode; // 0 = API, 1 = Migração Quiver, 2 = Manual
      var reguladoraFinal;
      if (origemUpper === "CARGA HISTORICA") {
        origemCode = 1;
        reguladoraFinal = reguladoraRaw;
      } else if (origemUpper === "API") {
        origemCode = 0;
        reguladoraFinal = reguladoraRaw;
      } else if (!origemRaw || origemUpper === "MANUAL" || origemUpper === "E-MAIL") {
        origemCode = 2;
        reguladoraFinal = reguladoraRaw;
      } else {
        origemCode = 0;
        reguladoraFinal = reguladoraRaw || origemRaw;
      }
      var reguladora = (!reguladoraFinal || reguladoraFinal.toUpperCase() === SEM_CORRESPONDENCIA) ? NAO_INFORMADA : reguladoraFinal;

      var aberturaRaw = r["Abertura"];
      if (!aberturaRaw) { totalSemAbertura++; return; }
      var d = new Date(aberturaRaw);
      if (isNaN(d.getTime())) { totalSemAbertura++; return; }
      if (!maxAbertura || d > maxAbertura) maxAbertura = d;

      var statusCode = STATUS_NAMES.indexOf(status); // -1 se não reconhecido
      var regIdx = regIdxFor(reguladora);
      var analistaRaw = norm(r["Analista Responsável"]);
      var analistaIdx = analystIdxFor(analistaRaw || ANALISTA_NAO_INFORMADO);

      var liquidacaoRaw = r["Data da liquidação"];
      var liqDays = null;
      if (liquidacaoRaw) {
        var dl = new Date(liquidacaoRaw);
        if (!isNaN(dl.getTime())) liqDays = daysSinceEpoch(dl);
      }

      var pagamentoRaw = r["Data do pagamento"] || r["Data de pagamento"] || r["Data de Pagamento"];
      var pagDays = null;
      if (pagamentoRaw) {
        var dp = new Date(pagamentoRaw);
        if (!isNaN(dp.getTime())) pagDays = daysSinceEpoch(dp);
      }

      var etapaRaw = norm(r["Atividade atual"]);
      var etapaIdx = etapaIdxFor(etapaRaw ? etapaLabel(etapaRaw) : ETAPA_NAO_INFORMADA);

      var gerenteRaw = formatGerenteName(norm(r["Comercial da Conta"]));
      var gerenteIdx = gerenteIdxFor(gerenteRaw || GERENTE_NAO_INFORMADO);

      // dados de detalhe (só para a tabela de processos ao filtrar) — ficam no array
      // SEPARADO detailRows, alinhado por índice com rowData via rowIdx
      var seguradoraRaw = norm(r["Seguradora"]);
      var seguradoraIdx = seguradoraIdxFor(seguradoraRaw || NAO_INFORMADA);
      var cnpjRaw = norm(r["CNPJ do cliente"]);
      var razaoSocialRaw = norm(r["Razão social do cliente"]);
      var clienteIdx = clienteIdxFor(cnpjRaw, razaoSocialRaw);
      var processoRaw = norm(r["Processo"] || r["#Processo"]);
      var numSinistroRegRaw = norm(r["Número do sinistro Reguladora"]);
      var apoliceRaw = norm(r["Número da apólice"]);
      var rowIdx = detailRows.length;
      detailRows.push([clienteIdx, seguradoraIdx, processoRaw, numSinistroRegRaw, apoliceRaw]);

      rowData.push([daysSinceEpoch(d), statusCode, origemCode, regIdx, liqDays, analistaIdx, pagDays, etapaIdx, gerenteIdx, rowIdx]);
    });

    var totals = computeCumulative(rowData, regIndex, analystIndex, Infinity, etapaIndex, gerenteIndex);
    totals.rowData = rowData;
    totals.regIndex = regIndex;
    totals.analystIndex = analystIndex;
    totals.etapaIndex = etapaIndex;
    totals.gerenteIndex = gerenteIndex;
    totals.detailRows = detailRows;
    totals.clienteIndex = clienteIndex;
    totals.seguradoraIndex = seguradoraIndex;
    totals.asOfDate = maxAbertura ? maxAbertura.toISOString() : null;
    totals.totalSemAbertura = totalSemAbertura;
    return totals;
  }

  // Recalcula todos os indicadores considerando só os sinistros cuja ABERTURA
  // é menor ou igual ao corte informado (cutoffDays = dias desde epoch, ou Infinity p/ tudo).
  // Também calcula o atraso médio (em dias) dos processos atrasados até a data de corte.
  function computeCumulative(rowData, regIndex, analystIndex, cutoffDays, etapaIndex, gerenteIndex) {
    var total = 0, manual = 0, api = 0, quiver = 0;
    var aberto = 0, encerrado = 0, emAndamento = 0, atrasado = 0, aprovado = 0, cancelado = 0, rejeitado = 0;
    var byRegTotal = {}, byRegAPI = {}, byAnalistaTotal = {}, byAnalistaAberto = {}, byAnalistaEncerrado = {};
    var byEtapaTotal = {};
    var byEtapaAtrasado = {};
    var byGerenteTotal = {}, byGerenteAberto = {}, byGerenteEncerrado = {};
    var atrasoDiasSoma = 0, atrasoCount = 0;
    // reguladoras associadas (API_REGULATORS) x não associadas — pedido do Antonio Carlos
    var assoc = { total: 0, aberto: 0, atrasado: 0 }, naoAssoc = { total: 0, aberto: 0, atrasado: 0 };

    rowData.forEach(function (row) {
      var abDays = row[0], statusCode = row[1], origemCode = row[2], regIdx = row[3], analistaIdx = row[5], etapaIdx = row[7], gerenteIdx = row[8];
      if (abDays > cutoffDays) return;
      total++;
      if (origemCode === 0) api++; else if (origemCode === 1) quiver++; else manual++;
      var regName = regIndex[regIdx];
      byRegTotal[regName] = (byRegTotal[regName] || 0) + 1;
      if (origemCode === 0) byRegAPI[regName] = (byRegAPI[regName] || 0) + 1;
      var isAssoc = API_REGULATORS.indexOf(regName) !== -1;
      var assocBucket = isAssoc ? assoc : naoAssoc;
      assocBucket.total++;

      var isAberto = statusCode === 1 || statusCode === 2;
      if (isAberto) assocBucket.aberto++;
      if (analystIndex && analistaIdx !== undefined) {
        var analistaName = analystIndex[analistaIdx];
        byAnalistaTotal[analistaName] = (byAnalistaTotal[analistaName] || 0) + 1;
        if (isAberto) byAnalistaAberto[analistaName] = (byAnalistaAberto[analistaName] || 0) + 1;
        else byAnalistaEncerrado[analistaName] = (byAnalistaEncerrado[analistaName] || 0) + 1;
      }
      if (etapaIndex && etapaIdx !== undefined) {
        var etapaName = etapaIndex[etapaIdx];
        byEtapaTotal[etapaName] = (byEtapaTotal[etapaName] || 0) + 1;
        if (statusCode === 1) byEtapaAtrasado[etapaName] = (byEtapaAtrasado[etapaName] || 0) + 1;
      }
      if (gerenteIndex && gerenteIdx !== undefined) {
        var gerenteName = gerenteIndex[gerenteIdx];
        byGerenteTotal[gerenteName] = (byGerenteTotal[gerenteName] || 0) + 1;
        if (isAberto) byGerenteAberto[gerenteName] = (byGerenteAberto[gerenteName] || 0) + 1;
        else byGerenteEncerrado[gerenteName] = (byGerenteEncerrado[gerenteName] || 0) + 1;
      }

      if (statusCode === 1) {
        atrasado++; aberto++; assocBucket.atrasado++;
        if (isFinite(cutoffDays)) { atrasoDiasSoma += (cutoffDays - abDays); atrasoCount++; }
      }
      else if (statusCode === 2) { emAndamento++; aberto++; }
      else if (statusCode === 0) { aprovado++; encerrado++; }
      else if (statusCode === 3) { cancelado++; encerrado++; }
      else if (statusCode === 4) { rejeitado++; encerrado++; }
    });

    return {
      total: total, manual: manual, api: api, quiver: quiver,
      aberto: aberto, encerrado: encerrado, emAndamento: emAndamento, atrasado: atrasado,
      aprovado: aprovado, cancelado: cancelado, rejeitado: rejeitado,
      byRegTotal: byRegTotal, byRegAPI: byRegAPI,
      byAnalistaTotal: byAnalistaTotal, byAnalistaAberto: byAnalistaAberto, byAnalistaEncerrado: byAnalistaEncerrado,
      byEtapaTotal: byEtapaTotal,
      byEtapaAtrasado: byEtapaAtrasado,
      byGerenteTotal: byGerenteTotal, byGerenteAberto: byGerenteAberto, byGerenteEncerrado: byGerenteEncerrado,
      atrasoMedioDias: atrasoCount ? Math.round(atrasoDiasSoma / atrasoCount) : null,
      assoc: assoc, naoAssoc: naoAssoc,
    };
  }

  // Data do Go-Live do Alper Cargo na Lecom — início fixo da série de evolução,
  // independente da data de corte escolhida.
  var GO_LIVE_DATE = new Date("2026-09-23T12:00:00");
  var SHOW_TREND_CARD = false; // card "Evolução desde o Go-Live" ocultado a pedido — mude para true para reativar
  var SHOW_ASSOC_CARD = false; // card "Reguladoras associadas x não associadas" ocultado a pedido (27/10) — mude para true para reativar

  // Reconstrói o estado REAL do processo em uma data passada, usando a data de
  // liquidação (quando existir): um processo só conta como "encerrado" na data de
  // corte se já tinha sido liquidado até aquela data — não só porque está encerrado
  // HOJE. Uploads antigos sem a coluna "Data da liquidação" (linhas com só 4
  // posições) usam o status atual como aproximação, já que não há outra referência.
  function computeHistoricalPoint(rowData, cutoffDays) {
    var total = 0, encerrado = 0, aberto = 0;
    rowData.forEach(function (row) {
      var abDays = row[0], statusCode = row[1], liqDays = row.length > 4 ? row[4] : undefined;
      if (abDays > cutoffDays) return;
      total++;
      if (liqDays !== undefined) {
        if (liqDays !== null && liqDays <= cutoffDays) encerrado++; else aberto++;
      } else {
        var isEncerradoAgora = statusCode === 0 || statusCode === 3 || statusCode === 4;
        if (isEncerradoAgora) encerrado++; else aberto++;
      }
    });
    return { total: total, encerrado: encerrado, aberto: aberto };
  }

  // Série semanal do Go-Live até a data de corte, calculada a partir do MESMO
  // upload via fatiamento por data de abertura/liquidação — não depende de múltiplos uploads.
  function computeTrendSeries(rowData, regIndex, startDate, cutoffDate) {
    var series = [];
    var d = new Date(startDate);
    while (d < cutoffDate) {
      var agg = computeHistoricalPoint(rowData, daysSinceEpoch(d));
      series.push({ label: fmtDateShort(d), total: agg.total, aberto: agg.aberto, encerrado: agg.encerrado });
      d = daysBack(d, -7); // avança 7 dias
    }
    var finalAgg = computeHistoricalPoint(rowData, daysSinceEpoch(cutoffDate));
    series.push({ label: fmtDateShort(cutoffDate), total: finalAgg.total, aberto: finalAgg.aberto, encerrado: finalAgg.encerrado });
    return series;
  }

  // ---------------- rendering ----------------

  function refDate(snapshot) { return snapshot.asOfDate || snapshot.uploadedAt; }

  function setupDateFilterRange() {
    if (!sourceDoc || !Array.isArray(sourceDoc.data.rowData) || !sourceDoc.data.rowData.length) return;
    var days = sourceDoc.data.rowData.map(function (r) { return r[0]; });
    var minD = dateFromDays(Math.min.apply(null, days));
    var maxD = dateFromDays(Math.max.apply(null, days));
    dateFilter.min = minD.toISOString().slice(0, 10);
    dateFilter.max = maxD.toISOString().slice(0, 10);
    if (!dateFilter.value) dateFilter.value = maxD.toISOString().slice(0, 10);
  }

  function showSkeleton() {
    content.innerHTML =
      '<div class="skeleton">' +
      '<div class="skeleton-row">' +

  function loadAndRender(db) {
    currentDb = db;
    showSkeleton();
    db.collection("snapshots").orderBy("uploadedAt", "desc").limit(20).get().then(function (snap) {
      processBtn.disabled = !pendingRows;
      if (snap.empty) {
        tabNav.style.display = "none";
        periodBar.style.display = "none";
        toolbarRow.style.display = "none";
        filterExplain.style.display = "none";
        sourceBadge.style.display = "none";
        lastUpdateEl.style.display = "none";
        uploadCard.classList.remove("collapsed");
        content.innerHTML = '<div class="empty-state">' +
          '<div class="big-icon">' + icoSpan("folder") + '</div>' +
          '<div><strong>Nenhum dado ainda</strong></div>' +
          '<div class="hint">Use o formulário abaixo para enviar sua primeira planilha.</div>' +
          '</div>';
        return;
      }
      allDocs = snap.docs.map(function (d) { return { id: d.id, data: d.data() }; });

      var withRows = allDocs.filter(function (d) { return Array.isArray(d.data.rowData) && d.data.rowData.length; });
      withRows.sort(function (a, b) { return new Date(b.data.uploadedAt) - new Date(a.data.uploadedAt); });
      sourceDoc = withRows.length ? withRows[0] : null;

      tabNav.style.display = "flex";
      toolbarRow.style.display = "flex";
      compareGroup.style.display = "flex";
      uploadCard.classList.add("collapsed");
      setupDateFilterRange();

      var latest = allDocs[0].data;
      if (latest.uploadedAt) {
        lastUpdateEl.style.display = "flex";
        var uploadedDate = new Date(latest.uploadedAt);
        var uploadedDateOnly = uploadedDate.toLocaleDateString("pt-BR");
        var labelDiffers = latest.label && latest.label.trim() !== uploadedDateOnly;
        lastUpdateEl.querySelector("span:last-child").textContent =
          "Última atualização: " + uploadedDate.toLocaleString("pt-BR") + (labelDiffers ? " (" + latest.label + ")" : "");
      }

      // busca o documento de detalhe (tabela de processos ao filtrar) correspondente ao
      // snapshot em uso — fica numa colecao separada, pode nao existir (snapshot antigo,
      // ou o salvamento do detalhe falhou) e nesse caso a tabela simplesmente nao aparece.
      // Sem tentar casar por id/data (isso se provou frágil no armazenamento real) — como os
      // dois documentos são sempre salvos juntos, no mesmo envio, o mais recente de cada
      // coleção sempre corresponde ao mesmo upload.
      sourceDetail = null;
      if (sourceDoc) {
        db.collection("snapshot_details").orderBy("uploadedAt", "desc").limit(1).get().then(function (detailSnap) {
          sourceDetail = detailSnap.docs.length ? detailSnap.docs[0].data() : null;
          renderDashboard();
        }).catch(function (err) {
          console.error("[detalhe] erro ao buscar a colecao snapshot_details:", err);
          sourceDetail = null;
          renderDashboard();
        });
      } else {
        renderDashboard();
      }
    }).catch(function (err) {
      content.innerHTML = '<div class="empty-state">Erro ao carregar histórico: ' + (err && err.message ? err.message : err) + '</div>';
    });
  }

  function fmt(n) { return (n || 0).toLocaleString("pt-BR"); }
  function fmtDate(d) { return d.toLocaleDateString("pt-BR"); }
  function fmtDateShort(d) { return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0"); }

  function deltaHtml(curr, prev, invert) {
    if (prev === undefined || prev === null) {
      return '<div class="delta neutral">— sem período anterior</div>';
    }
    var diff = curr - prev;
    var pct = prev !== 0 ? (diff / prev * 100) : (curr !== 0 ? 100 : 0);
    var arrow = diff > 0 ? "▲" : diff < 0 ? "▼" : "•";
    var kind = "neutral";
    if (diff !== 0 && invert !== null) {
      var better = invert ? diff < 0 : diff > 0;
      kind = better ? "good" : "bad";
    }
    var sign = diff > 0 ? "+" : "";
    return '<div class="delta ' + kind + '">' + arrow + ' ' + sign + fmt(diff) +
      ' (' + sign + pct.toFixed(1) + '%) <span style="color:var(--color-fg-muted); font-weight:500;">vs. anterior</span></div>';
  }

  function buildSummary(current, previous, skipAlertStat) {
    var parts = [];
    if (!skipAlertStat) {
      if (current.aberto > 0) {
        var pctEmDiaAberto = Math.round((current.aberto - current.atrasado) / current.aberto * 100);
        parts.push("Dos processos em aberto, " + fmt(pctEmDiaAberto) + "% estão em dia e " + fmt(100 - pctEmDiaAberto) + "% estão atrasados.");
      } else {
        parts.push("Nenhum processo em aberto no período.");
      }
    }
    if (previous && previous.atrasado !== undefined) {
      var diff = current.atrasado - previous.atrasado;
      if (diff !== 0) {
        var pct = previous.atrasado !== 0 ? Math.abs(diff / previous.atrasado * 100) : 100;
        parts.push((diff > 0 ? "Atenção: atrasados subiram " : "Atrasados caíram ") + pct.toFixed(0) + "% em relação ao período anterior.");
      } else {
        parts.push("Atrasados estáveis em relação ao período anterior.");
      }
    }
    if (current.atrasoMedioDias !== null && current.atrasoMedioDias !== undefined) {
      parts.push("Atraso médio atual: " + current.atrasoMedioDias + " dias.");
    }
    return parts.length ? parts.join(" ") : null;
  }

  var BLOCKED_MSG = "A plataforma Lecom não possui dados que permitam gerar este indicador";

  function caseMetricCard(title, meta, valueHtml, neededNote) {
    var blocked = !valueHtml;
    return '<div class="card case-metric">' +
      '<div class="case-metric-title">' + title + '</div>' +
      (meta ? '<div class="case-metric-meta">Meta: ' + meta + '</div>' : '') +
      (blocked
        ? '<div class="case-blocked">' + BLOCKED_MSG + '.</div>' + (neededNote ? '<div class="case-needed">' + icoSpan("clipboard") + ' ' + neededNote + '</div>' : '')
        : '<div class="case-metric-value">' + valueHtml + '</div>') +
      '</div>';
  }

  // Monta a aba "Métricas-chave do Case" — todas as métricas e ganhos do case aprovado
  // (Case SVP Transportes, slides 5 e 6), mesmo as que ainda não têm dado na Lecom.
  // Calcula automação considerando só sinistros ABERTOS DESDE O GO-LIVE (23/09/2026) —
  // a partir dessa data os usuários passaram a operar na plataforma e as reguladoras a
  // enviar por API, então migração histórica (Quiver) não deve entrar nessa conta.
  function computeAutomacao(rowData, rangeStartDays, rangeEndDays) {
    if (!rowData) return null;
    var api = 0, manual = 0;
    rowData.forEach(function (row) {
      var abDays = row[0], origemCode = row[2];
      if (abDays < rangeStartDays || abDays > rangeEndDays) return;
      if (origemCode === 0) api++;
      else if (origemCode !== 1) manual++; // exclui eventual resquicio de migracao (codigo 1)
    });
    var base = api + manual;
    return { api: api, manual: manual, base: base, pct: base > 0 ? Math.round((api / base) * 100) : null };
  }

  // Calcula o SLA medio (Abertura -> Pagamento) dentro do intervalo informado. Enquanto
  // nao houver nenhuma data de pagamento preenchida no intervalo, usa um PROXY
  // provisorio: tempo medio em aberto (abertura -> hoje/data de corte) para os mesmos
  // processos. Assim que existir ao menos 1 pagamento real no intervalo, passa a usar
  // sempre o calculo real (Abertura -> Pagamento).
  function computeSla(rowData, rangeStartDays, rangeEndDays, todayDays) {
    if (!rowData) return null;
    var somaReal = 0, countReal = 0;
    var somaProxy = 0, countProxy = 0;
    rowData.forEach(function (row) {
      var abDays = row[0], pagDays = row[6];
      if (abDays < rangeStartDays || abDays > rangeEndDays) return;
      countProxy++;
      somaProxy += (todayDays - abDays);
      if (pagDays !== undefined && pagDays !== null) {
        var dias = pagDays - abDays;
        if (dias >= 0) { somaReal += dias; countReal++; }
      }
    });
    if (countReal > 0) return { mode: "real", count: countReal, avgDays: Math.round(somaReal / countReal) };
    if (countProxy > 0) return { mode: "proxy", count: countProxy, avgDays: Math.round(somaProxy / countProxy) };
    return null;
  }

  // Filtra rowData pelo modo de período escolhido (compartilhado entre as duas abas):
  // "tudo" nao filtra nada, "antes" so abertura < Go-Live, "golive" so abertura >= Go-Live.
  function applyDateRangeMode(rowData, mode, cutoffDate) {
    if (!rowData || mode === "tudo") return rowData;
    var goDays = daysSinceEpoch(GO_LIVE_DATE);
    var cutDays = daysSinceEpoch(cutoffDate);
    var rangeStart, rangeEnd;
    if (mode === "antes") { rangeStart = -Infinity; rangeEnd = Math.min(goDays - 1, cutDays); }
    else { rangeStart = goDays; rangeEnd = cutDays; } // golive
    return rowData.filter(function (row) { return row[0] >= rangeStart && row[0] <= rangeEnd; });
  }

  // atualiza só o estado visual do bloco fixo "Período de análise" (botão ativo + legenda)
  function updatePeriodBar() {
    document.querySelectorAll("#caseDateGroup [data-mode]").forEach(function (btn) {

    periodCaption.textContent = caseDateMode === "antes"

      : caseDateMode === "golive"
      ? "Sinistros abertos a partir de 23/09/2026 — operação na Lecom."
      : "Todos os sinistros (Quiver + Lecom).";
  }

  function renderDashboard() {
    var current, previous, cutoffDate, previousCutoffDate;

    if (sourceDoc) {
      cutoffDate = dateFilter.value ? new Date(dateFilter.value + "T12:00:00") : dateFromDays(Math.max.apply(null, sourceDoc.data.rowData.map(function (r) { return r[0]; })));
      var curDays = daysSinceEpoch(cutoffDate);
      var effectiveRowData = applyActiveFilter(sourceDoc.data.rowData, sourceDoc.data.regIndex, sourceDoc.data.analystIndex, activeFilter, sourceDoc.data.etapaIndex, sourceDoc.data.gerenteIndex);
      var operacaoRowData = applyDateRangeMode(effectiveRowData, caseDateMode, cutoffDate);
      current = computeCumulative(operacaoRowData, sourceDoc.data.regIndex, sourceDoc.data.analystIndex, curDays, sourceDoc.data.etapaIndex, sourceDoc.data.gerenteIndex);

      var mode = compareSelect.value || "1d";
      previousCutoffDate = mode === "7d" ? daysBack(cutoffDate, 7) : mode === "30d" ? monthsBack(cutoffDate, 1) : mode === "365d" ? monthsBack(cutoffDate, 12) : daysBack(cutoffDate, 1);
      var prevDays = daysSinceEpoch(previousCutoffDate);
      previous = computeCumulative(operacaoRowData, sourceDoc.data.regIndex, sourceDoc.data.analystIndex, prevDays, sourceDoc.data.etapaIndex, sourceDoc.data.gerenteIndex);

      filterExplain.style.display = "block";
      filterExplain.textContent = "Mostrando sinistros com abertura até " + fmtDate(cutoffDate) +
        "  •  Comparando com sinistros com abertura até " + fmtDate(previousCutoffDate);
    } else if (allDocs.length) {
      current = allDocs[0].data;
      previous = null;
      filterExplain.style.display = "none";
      sourceBadge.style.display = "none";
    } else {
      return;
    }

    if (activeTab === "case") {
      toolbarRow.style.display = "none";
      filterExplain.style.display = "none";
      periodBar.style.display = "block";
      periodBar.classList.add("standalone");
      updatePeriodBar();
      content.innerHTML = renderCaseTab(current, effectiveRowData, cutoffDate);
      return;
    }
    toolbarRow.style.display = "flex";
    periodBar.style.display = "block";
    periodBar.classList.remove("standalone");
    updatePeriodBar();

    var html = "";

    // aviso de dados desatualizados (mais de 7 dias desde o último upload)
    var latestUpload = allDocs[0] && allDocs[0].data.uploadedAt ? new Date(allDocs[0].data.uploadedAt) : null;
    if (latestUpload) {
      var diasSemAtualizar = Math.floor((Date.now() - latestUpload.getTime()) / 86400000);
      if (diasSemAtualizar > 7) {
        html += '<div class="stale-banner"><div class="icon">' + icoSpan("clock") + '</div><div>' +
          '<strong>Dados de ' + diasSemAtualizar + ' dias atrás</strong> — nenhuma atualização desde ' +
          latestUpload.toLocaleDateString("pt-BR") + '. Considere atualizar a planilha antes de tomar decisões com base nestes números.' +
          '</div></div>';
      }
    }

    // chip do filtro de clique (drill-down) ativo
    if (activeFilter) {
      html += '<div class="active-filter-chip">' + icoSpan("filterFunnel") + ' Filtrado por: <strong>' + activeFilter.displayLabel + '</strong> ' +
        '<button type="button" id="clearFilterBtn">' + icoSpan("close") + ' Limpar filtro</button></div>';
      html += buildDetailTable(operacaoRowData, sourceDoc.data.regIndex, sourceDoc.data.analystIndex, sourceDoc.data.gerenteIndex, sourceDetail);
    }

    // alerta de taxa crítica de atraso — calculado antes do resumo para evitar repetir o mesmo dado
    var atrasoRate = current.aberto > 0 ? (current.atrasado / current.aberto) : 0;
    var showAlert = current.aberto > 0 && atrasoRate >= 0.5;

    // resumo executivo automático — quando o alerta crítico já aparece, o resumo não repete
    // o mesmo percentual, só complementa com tendência e atraso médio
    var summaryText = buildSummary(current, previous, showAlert);

    // detalhamento associada x não associada vai no tooltip "?" do card (clique pra ver),
    // em vez de uma linha sempre visível — mantém o card limpo, igual antes dessa info existir
    var abertoAssocPct = current.aberto > 0 ? Math.round((current.assoc.aberto / current.aberto) * 100) : 0;
    var atrasadoAssocPct = current.atrasado > 0 ? Math.round((current.assoc.atrasado / current.atrasado) * 100) : 0;
    var abertoTip = current.aberto > 0 ? ('Dos processos em aberto, ' + abertoAssocPct + '% são de reguladora associada e ' + (100 - abertoAssocPct) + '% de não associada.') : null;
    var atrasadoTip = current.atrasado > 0 ? ('Dos processos atrasados, ' + atrasadoAssocPct + '% são de reguladora associada e ' + (100 - atrasadoAssocPct) + '% de não associada.') : null;

    // KPI cards
    html += '<div class="kpi-grid">';
    html += kpiCard("Total de processos", current.total, previous && previous.total, null, false, ICONS.folder, COLORS.navy, null);
    html += kpiCard("Em aberto", current.aberto, previous && previous.aberto, null, false, ICONS.folderOpen, COLORS.amber, abertoTip);
    html += kpiCard("Atrasados", current.atrasado, previous && previous.atrasado, true, false, ICONS.clock, COLORS.coral, atrasadoTip);
    html += kpiCard("Encerrados", current.encerrado, previous && previous.encerrado, false, false, ICONS.checkCircle, COLORS.green);
    html += kpiCard("Atraso médio (dias)", current.atrasoMedioDias, previous && previous.atrasoMedioDias, true, true, ICONS.calendar, COLORS.maroon, "Média de dias em atraso dos processos que estão atrasados HOJE (na data de corte escolhida), contando a partir da data de abertura de cada um.");
    html += "</div>";

    // resumo executivo e alerta de atraso
    if (summaryText) {
      html += '<div class="summary-banner">' + icoSpan("pin") + ' ' + summaryText + '</div>';
    }
    if (showAlert) {
      html += '<div class="alert-banner"><div class="icon">' + icoSpan("alertTriangle") + '</div><div>' +
        '<strong>' + fmt(current.atrasado) + ' processos atrasados</strong> — ' +
        (atrasoRate * 100).toFixed(0) + '% dos processos em aberto (' + fmt(current.aberto) + ') estão com prazo vencido.' +
        '</div></div>';
    }

    // legenda de cores — logo antes dos gráficos que usam essas cores
    html += '<div class="color-legend">' +
      '<span class="item"><span class="dot" style="background:' + COLORS.navy + ';"></span>Total / neutro</span>' +
      '<span class="item"><span class="dot" style="background:' + COLORS.amber + ';"></span>Em aberto / atenção</span>' +
      '<span class="item"><span class="dot" style="background:' + COLORS.coral + ';"></span>Atrasado / crítico</span>' +
      '<span class="item"><span class="dot" style="background:' + COLORS.green + ';"></span>Encerrado / concluído</span>' +
      '</div>';

    // charts
    html += '<div class="section-title">Status da operação</div>';
    html += '<div class="chart-grid">';
    html += '<div class="chart-card"><h3>PROCESSOS POR STATUS <span class="hint-click">' + icoSpan("lightbulb") + ' clique no gráfico para filtrar</span></h3><div id="chart-status"></div></div>';
    html += '<div class="chart-card"><h3>STATUS DETALHADO DO PROCESSO <span class="hint-click">' + icoSpan("lightbulb") + ' clique no gráfico para filtrar</span></h3><div id="chart-detalhado"></div></div>';
    html += '</div>';

    html += '<div class="section-title">Processos por etapa</div>';
    html += '<div class="chart-card etapa-card"><h3>ATIVIDADE ATUAL <span class="hint-click">' + icoSpan("lightbulb") + ' clique no gráfico para filtrar</span></h3>' +
      '<div class="etapa-group-label etapa-group-andamento">' + icoSpan("refresh") + ' Em andamento</div>' +
      '<div id="chart-etapa-andamento"></div>' +
      '<div class="etapa-group-label etapa-group-finalizado">' + icoSpan("checkCircle") + ' Finalizado</div>' +
      '<div id="chart-etapa-finalizado"></div>' +
      '</div>';

    html += '<div class="chart-card" style="margin-bottom:16px;"><h3>' + icoSpan("alertTriangle") + ' ONDE ESTÃO OS ATRASADOS <span class="hint-click">' + icoSpan("lightbulb") + ' clique no gráfico para filtrar</span></h3><div id="chart-etapa-atraso"></div></div>';

    html += '<div class="section-title">Analistas</div>';
    html += '<div class="chart-card" style="margin-bottom:16px;"><div class="chart-card-head"><h3>ANALISTAS <span class="hint-click">' + icoSpan("lightbulb") + ' clique no gráfico para filtrar</span></h3>' +
      '<div style="display:flex; align-items:center; gap:10px;">' +
      statusFilterGroupHtml() +
      '<button class="secondary" id="analystToggleBtn" style="display:none; padding:5px 12px; font-size: var(--fs-xs);"></button>' +
      '</div></div>' +
      '<div class="chart-search-row">' +
      '<input type="text" class="chart-search" id="analystSearchInput" placeholder="Buscar analista..." value="' + analystSearch.replace(/"/g, "&quot;") + '">' +
      '<button type="button" class="secondary chart-export-btn" id="analystExportBtn" title="Baixar esta lista em CSV">' + icoSpan("download") + ' CSV</button>' +
      '</div>' +
      '<div id="chart-analista"></div></div>';

    html += '<div class="section-title">Gerentes de Relacionamento</div>';
    html += '<div class="chart-card" style="margin-bottom:16px;"><div class="chart-card-head"><h3>COMERCIAL DA CONTA <span class="hint-click">' + icoSpan("lightbulb") + ' clique no gráfico para filtrar</span></h3>' +
      '<div style="display:flex; align-items:center; gap:10px;">' +
      statusFilterGroupHtml() +
      '<button class="secondary" id="gerenteToggleBtn" style="display:none; padding:5px 12px; font-size: var(--fs-xs);"></button>' +
      '</div></div>' +
      '<div class="chart-search-row">' +
      '<input type="text" class="chart-search" id="gerenteSearchInput" placeholder="Buscar gerente..." value="' + gerenteSearch.replace(/"/g, "&quot;") + '">' +
      '<button type="button" class="secondary chart-export-btn" id="gerenteExportBtn" title="Baixar esta lista em CSV">' + icoSpan("download") + ' CSV</button>' +
      '</div>' +
      '<div id="chart-gerente"></div></div>';

    html += '<div class="section-title">Reguladoras</div>';
    html += '<div class="chart-card" style="margin-bottom:16px;"><div class="chart-card-head"><h3>REGULADORAS <span class="hint-click">' + icoSpan("lightbulb") + ' clique no gráfico para filtrar</span></h3>' +
      '<div style="display:flex; align-items:center; gap:10px;">' +
      statusFilterGroupHtml() +
      '<button class="secondary" id="regToggleBtn" style="display:none; padding:5px 12px; font-size: var(--fs-xs);"></button>' +
      '</div></div>' +
      '<div class="chart-search-row">' +
      '<input type="text" class="chart-search" id="regSearchInput" placeholder="Buscar reguladora..." value="' + regSearch.replace(/"/g, "&quot;") + '">' +
      '<button type="button" class="secondary chart-export-btn" id="regExportBtn" title="Baixar esta lista em CSV">' + icoSpan("download") + ' CSV</button>' +
      '</div>' +
      '<div id="chart-top"></div><div style="margin-top:10px;"><span class="pill-outline">' + icoSpan("bolt") + ' Reguladora com integração via API (Associada)</span></div></div>';

    // reguladoras associadas x não associadas — pedido do Antonio Carlos na reunião de 23/10;
    // fica junto dos demais dados de reguladoras, logo após o ranking por volume.
    // Ocultado a pedido em 27/10 (SHOW_ASSOC_CARD acima) — cálculo e gráfico continuam
    // prontos, só não aparecem.
    if (SHOW_ASSOC_CARD) {
      var totalBase = current.assoc.total + current.naoAssoc.total;
      var totalAssocPct = totalBase > 0 ? Math.round((current.assoc.total / totalBase) * 100) : 0;
      var totalNaoAssocPct = totalBase > 0 ? 100 - totalAssocPct : 0;
      html += '<div class="card assoc-breakdown-card">' +
        '<h3>Reguladoras associadas x não associadas</h3>' +
        '<div class="assoc-total-highlight">' +
        '<div class="assoc-total-stat"><span class="n" style="color:#2E86C1;">' + fmt(current.assoc.total) + '</span><span class="l">Associadas · Total geral (' + totalAssocPct + '%)</span></div>' +
        '<div class="assoc-total-stat"><span class="n" style="color:' + COLORS.gray + ';">' + fmt(current.naoAssoc.total) + '</span><span class="l">Não associadas · Total geral (' + totalNaoAssocPct + '%)</span></div>' +
        '</div>' +
        '<div class="assoc-group-label">Por status</div>' +
        '<div id="chart-assoc"></div>' +
        '<div class="assoc-legend">' +
        '<span class="item"><span class="dot" style="background:' + COLORS.navy + ';"></span>Associadas</span>' +
        '<span class="item"><span class="dot" style="background:' + COLORS.gray + ';"></span>Não associadas</span>' +
        '</div>' +
        '<div class="pill-outline">' + icoSpan("bolt") + ' Associadas: Dórica, Fox, L Perna, Serra & Company</div>' +
        '</div>';
    }

    html += '<div class="section-title">Composição da base</div>';
    html += '<div class="chart-grid">';
    html += '<div class="chart-card"><div class="chart-card-head"><h3>TIPO DE REGISTRO <span class="hint-click">' + icoSpan("lightbulb") + ' clique no gráfico para filtrar</span></h3>' + statusFilterGroupHtml() + '</div><div id="chart-tipo"></div></div>';
    html += '<div class="chart-card"><div class="chart-card-head"><h3>PROCESSOS VIA API (POR REGULADORA) <span class="hint-click">' + icoSpan("lightbulb") + ' clique no gráfico para filtrar</span></h3>' + statusFilterGroupHtml() + '</div><div id="chart-api"></div></div>';
    html += '</div>';

    // tendência — calculada por fatiamento de data, não depende de múltiplos uploads
    // (card ocultado a pedido: ainda não é um dado relevante neste momento do projeto)
    if (sourceDoc && SHOW_TREND_CARD) {
      html += '<div class="section-title">Evolução desde o Go-Live (23/09/2026), por data de abertura</div>';
      html += '<div class="chart-card" style="margin-bottom:16px;"><div id="chart-trend"></div></div>';
    }

    // history — fica fora do PDF; aqui é só um log de uploads, não participa do corte por data
    html += '<div id="historySection">';
    html += '<div class="section-title" style="display:flex; align-items:center; gap:10px;">Histórico de atualizações <button type="button" class="add-data-btn" id="addDataBtn" title="Adicionar nova atualização" aria-label="Adicionar nova atualização">+</button></div>';
    html += '<div class="card"><div class="table-scroll"><table class="history"><thead><tr><th>Rótulo</th><th>Linhas</th><th>Enviado em</th><th></th></tr></thead><tbody>';
    allDocs.forEach(function (d) {
      var r = d.data;
      var when = r.uploadedAt ? new Date(r.uploadedAt).toLocaleString("pt-BR") : "—";
      html += '<tr class="' + (sourceDoc && d.id === sourceDoc.id ? "current" : "") + '">' +
        '<td>' + (r.label || "—") + (sourceDoc && d.id === sourceDoc.id ? ' <span class="pill now">fonte atual</span>' : '') + '</td>' +
        '<td>' + fmt(r.total) + '</td>' +
        '<td>' + when + '</td>' +
        '<td class="actions">' + (d.id !== "local" ? '<button class="del-btn" data-del-id="' + d.id + '" title="Excluir este registro" aria-label="Excluir registro ' + (r.label || "") + '">' + icoSpan("trash") + '</button>' : '') + '</td>' +
        '</tr>';
    });
    html += '</tbody></table></div></div>';
    html += '</div>';

    content.innerHTML = html;
    content.classList.remove("content-fade-in");
    void content.offsetWidth; // forca reflow pra reiniciar a animacao a cada render
    content.classList.add("content-fade-in");
    animateCounters();
    makeSectionsCollapsible();
    positionAllSegIndicators();

    var analystSearchInput = document.getElementById("analystSearchInput");
    if (analystSearchInput) {
      analystSearchInput.addEventListener("input", function () {
        analystSearch = analystSearchInput.value;
        drawAnalystChart();
      });
    }
    var gerenteSearchInput = document.getElementById("gerenteSearchInput");
    if (gerenteSearchInput) {
      gerenteSearchInput.addEventListener("input", function () {
        gerenteSearch = gerenteSearchInput.value;
        drawGerenteChart();
      });
    }
    var regSearchInput = document.getElementById("regSearchInput");
    if (regSearchInput) {
      regSearchInput.addEventListener("input", function () {
        regSearch = regSearchInput.value;
        drawRegulatorChart();
      });
    }

    var analystExportBtn = document.getElementById("analystExportBtn");
    if (analystExportBtn) {
      analystExportBtn.addEventListener("click", function () {
        exportEntriesCsv(filterBySearch(allAnalystEntries, analystSearch), "analistas.csv");
      });
    }
    var gerenteExportBtn = document.getElementById("gerenteExportBtn");
    if (gerenteExportBtn) {
      gerenteExportBtn.addEventListener("click", function () {
        exportEntriesCsv(filterBySearch(allGerenteEntries, gerenteSearch), "gerentes_de_relacionamento.csv");
      });
    }
    var regExportBtn = document.getElementById("regExportBtn");
    if (regExportBtn) {
      regExportBtn.addEventListener("click", function () {
        exportEntriesCsv(filterBySearch(allRegulatorEntries, regSearch), "reguladoras.csv");
      });
    }

    var clearFilterBtn = document.getElementById("clearFilterBtn");
    if (clearFilterBtn) {
      clearFilterBtn.addEventListener("click", function () {
        activeFilter = null;
        renderDashboard();
      });
    }

    document.querySelectorAll(".sortable-th").forEach(function (th) {
      function activateSort() {
        var key = th.getAttribute("data-sort-key");
        if (detailSortCol === key) {
          detailSortDir = detailSortDir === "asc" ? "desc" : "asc";
        } else {
          detailSortCol = key;
          detailSortDir = "asc";
        }
        detailPage = 0;
        renderDashboardKeepScroll();
      }
      th.addEventListener("click", activateSort);
      th.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); activateSort(); }
      });
    });

    // trocar de página ou reordenar reconstrói o HTML inteiro do painel, o que por si só
    // pode jogar a rolagem de volta pro topo da tela — fazendo a tabela, lá embaixo, parecer
    // que "fechou". Essa função guarda a posição atual e restaura logo após renderizar.
    function renderDashboardKeepScroll() {
      var y = window.scrollY;
      renderDashboard();
      window.scrollTo(0, y);
      requestAnimationFrame(function () { window.scrollTo(0, y); });
    }

    var detailPrevBtn = document.getElementById("detailPrevBtn");
    if (detailPrevBtn) {
      detailPrevBtn.addEventListener("click", function () {
        detailPage = Math.max(0, detailPage - 1);
        renderDashboardKeepScroll();
      });
    }
    var detailNextBtn = document.getElementById("detailNextBtn");
    if (detailNextBtn) {
      detailNextBtn.addEventListener("click", function () {
        detailPage = detailPage + 1;
        renderDashboardKeepScroll();
      });
    }

    var addDataBtn = document.getElementById("addDataBtn");
    if (addDataBtn) {
      addDataBtn.addEventListener("click", function () {
        uploadCard.classList.toggle("collapsed");
        if (!uploadCard.classList.contains("collapsed")) uploadCard.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }

    document.querySelectorAll(".status-filter-group [data-filter]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        setStatusGroupSegment(btn.getAttribute("data-filter"));
      });
    });

    document.querySelectorAll("[data-del-id]").forEach(function (btn) {
      var confirming = false;
      var resetTimer = null;
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-del-id");
        if (!currentDb) return;
        if (!confirming) {
          confirming = true;
          btn.textContent = "Confirmar exclusão?";
          btn.title = "Clique de novo para confirmar";
          btn.style.color = "var(--color-coral)";
          btn.style.fontWeight = "700";
          btn.style.fontSize = "11.5px";
          resetTimer = setTimeout(function () {
            confirming = false;
            btn.innerHTML = icoSpan("trash");
            btn.style.color = "";
            btn.style.fontWeight = "";
            btn.style.fontSize = "";
          }, 4000);
          return;
        }
        clearTimeout(resetTimer);
        btn.disabled = true;
        btn.textContent = "Excluindo…";
        currentDb.collection("snapshots").doc(id).delete().then(function () {
          dateFilter.value = "";
          loadAndRender(currentDb);
        }).catch(function (err) {
          setStatus("Erro ao excluir: " + (err && err.message ? err.message : err), "err");
          btn.disabled = false;
          btn.innerHTML = icoSpan("trash");
        });
      });
    });

    // draw charts
    drawDonut("#chart-tipo", [
      { label: "Manual", value: current.manual, color: COLORS.gray },
      { label: "API", value: current.api, color: COLORS.teal },
      { label: "Migração Quiver", value: current.quiver, color: COLORS.navy },
    ], { filterDim: "origem", onClick: function (label) { setActiveFilter("origem", label, label); } });

    function gradient(n, c1, c2) {
      var interp = d3.interpolateRgb(c1, c2);
      var out = [];
      for (var i = 0; i < n; i++) out.push(interp(n <= 1 ? 0 : i / (n - 1)));
      return out;
    }

    var apiEntries = Object.keys(current.byRegAPI || {}).map(function (k) {
      return { label: k, value: current.byRegAPI[k] };
    }).sort(sortRegulators);
    var apiColors = gradient(apiEntries.length, COLORS.navy, COLORS.lightblue);
    apiEntries.forEach(function (e, i) { e.color = e.label === NAO_INFORMADA ? COLORS.amber : apiColors[i]; });
    drawBars("#chart-api", apiEntries, { horizontal: apiEntries.length > 5, filterDim: "reg", onClick: function (label) { setActiveFilter("reg", label, label); } });

    drawDonut("#chart-status", [
      { label: "Aberto", value: current.aberto, color: COLORS.amber },
      { label: "Encerrado", value: current.encerrado, color: COLORS.green },
    ], { filterDim: "statusgroup", onClick: function (label) { setActiveFilter("statusgroup", label, label); } });

    drawBars("#chart-detalhado", [
      { label: "Em andamento", value: current.emAndamento, color: COLORS.amber },
      { label: "Atrasado", value: current.atrasado, color: COLORS.coral },
      { label: "Aprovado", value: current.aprovado, color: COLORS.green },
      { label: "Cancelado", value: current.cancelado, color: COLORS.gray },
      { label: "Rejeitado", value: current.rejeitado, color: COLORS.maroon },
    ], { horizontal: false, groupSplit: 2, groupLabels: ["EM ABERTO", "ENCERRADO"], filterDim: "status", onClick: function (label) { setActiveFilter("status", label, label); } });

    if (SHOW_ASSOC_CARD) {
      drawAssocChart("#chart-assoc", [
        { label: "Em aberto", assoc: current.assoc.aberto, naoAssoc: current.naoAssoc.aberto },
        { label: "Atrasados", assoc: current.assoc.atrasado, naoAssoc: current.naoAssoc.atrasado },
      ]);
    }

    // Reagrupa por rótulo normalizado (cobre dados salvos antes da normalização existir) e
    // ordena pela SEQUÊNCIA DO FLUXO (ETAPA_ORDEM), não por quantidade — mostra o avanço
    // real dos processos etapa a etapa.
    var byEtapaNormalizado = {};
    Object.keys(current.byEtapaTotal || {}).forEach(function (k) {
      var label = k === ETAPA_NAO_INFORMADA ? k : etapaLabel(k);
      byEtapaNormalizado[label] = (byEtapaNormalizado[label] || 0) + current.byEtapaTotal[k];
    });
    var etapaEntries = Object.keys(byEtapaNormalizado).map(function (k) {
      return { label: k, value: byEtapaNormalizado[k] };
    });
    // "Em andamento" segue a sequência do fluxo (ETAPA_ORDEM); "Finalizado" ordena por quantidade
    var etapaAndamento = etapaEntries.filter(function (e) { return ETAPA_FINALIZADAS.indexOf(e.label) === -1; })
      .sort(function (a, b) {
        if (a.label === ETAPA_NAO_INFORMADA) return 1;
        if (b.label === ETAPA_NAO_INFORMADA) return -1;
        var ia = ETAPA_ORDEM.indexOf(a.label), ib = ETAPA_ORDEM.indexOf(b.label);
        if (ia === -1 && ib === -1) return a.label.localeCompare(b.label);
        if (ia === -1) return 1;
        if (ib === -1) return -1;
        return ia - ib;
      });
    var etapaFinalizado = etapaEntries.filter(function (e) { return ETAPA_FINALIZADAS.indexOf(e.label) !== -1; })
      .sort(function (a, b) { return b.value - a.value; });
    var etapaColors = gradient(etapaAndamento.length, COLORS.navy, COLORS.lightblue);
    etapaAndamento.forEach(function (e, i) { e.color = e.label === ETAPA_NAO_INFORMADA ? COLORS.amber : etapaColors[i]; });
    etapaFinalizado.forEach(function (e) { e.color = COLORS.green; });
    drawBars("#chart-etapa-andamento", etapaAndamento, { horizontal: true, filterDim: "etapa", onClick: function (label) { setActiveFilter("etapa", label, label); } });
    drawBars("#chart-etapa-finalizado", etapaFinalizado, { horizontal: true, filterDim: "etapa", onClick: function (label) { setActiveFilter("etapa", label, label); } });

    // "Onde estão os atrasados" — dos processos ATRASADOS, em qual etapa cada um está
    // parado. Ordenado por quantidade (maior gargalo primeiro), não pela sequência do fluxo.
    var byEtapaAtrasoNormalizado = {};
    Object.keys(current.byEtapaAtrasado || {}).forEach(function (k) {
      var label = k === ETAPA_NAO_INFORMADA ? k : etapaLabel(k);
      byEtapaAtrasoNormalizado[label] = (byEtapaAtrasoNormalizado[label] || 0) + current.byEtapaAtrasado[k];
    });
    var etapaAtrasoEntries = Object.keys(byEtapaAtrasoNormalizado)
      .filter(function (k) { return ETAPA_FINALIZADAS.indexOf(k) === -1; }) // processo já encerrado não conta como gargalo
      .map(function (k) {
        return { label: k, value: byEtapaAtrasoNormalizado[k], color: COLORS.coral };
      }).sort(function (a, b) { return b.value - a.value; });
    drawBars("#chart-etapa-atraso", etapaAtrasoEntries, { horizontal: true, filterDim: "etapa", onClick: function (label) { setActiveFilter("etapa", label, label); } });

    allRegulatorEntries = Object.keys(current.byRegTotal || {}).map(function (k) {
      return { label: k, value: current.byRegTotal[k] };
    }).sort(sortRegulators);
    allRegulatorEntries.forEach(function (e) { e.color = e.label === NAO_INFORMADA ? COLORS.amber : "#2E86C1"; });
    drawRegulatorChart();

    allAnalystEntries = (function () {
      // current já reflete o filtro global (ver effectiveRowData); byAnalistaTotal sempre
      // serve, seja o filtro "todos", "aberto" ou "encerrado"
      var source = current.byAnalistaTotal;
      var raw = Object.assign({}, source || {});
      var sistemaBreakdown = {};
      var sistemaTotal = 0;
      CONTAS_DE_SISTEMA_RAW.forEach(function (rawKey) {
        Object.keys(raw).forEach(function (k) {
          if (k.toLowerCase() === rawKey) {
            sistemaBreakdown[k] = raw[k];
            sistemaTotal += raw[k];
            delete raw[k];
          }
        });
      });
      var entries = Object.keys(raw).map(function (k) { return { label: formatAnalystName(k), value: raw[k] }; });
      if (sistemaTotal > 0) {
        var tooltipTxt = CONTA_DE_SISTEMA + ": " + fmt(sistemaTotal) + " (" +
          Object.keys(sistemaBreakdown).map(function (k) { return k + ": " + fmt(sistemaBreakdown[k]); }).join(", ") + ")";
        entries.push({ label: CONTA_DE_SISTEMA, value: sistemaTotal, tooltip: tooltipTxt });
      }
      return entries;
    })().sort(function (a, b) {
      var aSpecial = a.label === ANALISTA_NAO_INFORMADO || a.label === CONTA_DE_SISTEMA;
      var bSpecial = b.label === ANALISTA_NAO_INFORMADO || b.label === CONTA_DE_SISTEMA;
      if (aSpecial && !bSpecial) return 1;
      if (bSpecial && !aSpecial) return -1;
      if (aSpecial && bSpecial) return a.label === CONTA_DE_SISTEMA ? -1 : 1; // sistema antes de não informado
      return b.value - a.value;
    });
    allAnalystEntries.forEach(function (e) { e.color = (e.label === ANALISTA_NAO_INFORMADO || e.label === CONTA_DE_SISTEMA) ? COLORS.amber : "#2E86C1"; });
    drawAnalystChart();

    allGerenteEntries = (function () {
      var source = current.byGerenteTotal;
      return Object.keys(source || {}).map(function (k) { return { label: k, value: source[k] }; });
    })().sort(function (a, b) {
      if (a.label === GERENTE_NAO_INFORMADO) return 1;
      if (b.label === GERENTE_NAO_INFORMADO) return -1;
      return b.value - a.value;
    });
    allGerenteEntries.forEach(function (e) { e.color = e.label === GERENTE_NAO_INFORMADO ? COLORS.amber : "#2E86C1"; });
    drawGerenteChart();

    if (sourceDoc && SHOW_TREND_CARD) {
      if (cutoffDate < GO_LIVE_DATE) {
        d3.select("#chart-trend").append("div")
          .style("color", "var(--color-fg-muted)").style("font-size", "12px")
          .text("Esta base ainda não tem sinistros com abertura após o Go-Live (23/09/2026) — última abertura registrada: " + fmtDate(dateFromDays(Math.max.apply(null, sourceDoc.data.rowData.map(function (r) { return r[0]; })))) + ".");
      } else {
        var series = computeTrendSeries(effectiveRowData, sourceDoc.data.regIndex, GO_LIVE_DATE, cutoffDate);
        drawTrend("#chart-trend", series);
      }
    }
  }
