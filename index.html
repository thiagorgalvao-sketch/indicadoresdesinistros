<style>
  :root {
    --color-navy: #0B2A4A;
    --color-navy-2: #123F6E;
    --color-teal: #1C6E8C;
    --color-blue: #2E86C1;
    --color-lightblue: #5DADE2;
    --color-green: #1F8A5F;
    --color-green-bg: #E7F5EE;
    --color-amber: #E8A33D;
    --color-amber-bg: #FCF0E0;
    --color-coral: #E15241;
    --color-coral-bg: #FBEAEA;
    --color-gray: #A6ACAF;

    --color-bg: #F4F7FB;
    --color-panel: #FFFFFF;
    --color-fg: #16283C;
    --color-fg-muted: #5B6B76;
    --color-border-line: #E1E8EF;
    --color-accent-strong: #0B2A4A;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --color-bg: #0E1620;
      --color-panel: #16202C;
      --color-fg: #EAF1F8;
      --color-fg-muted: #93A5B5;
      --color-border-line: #263240;
      --color-accent-strong: #BFD8F2;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --color-bg: #0E1620;
    --color-panel: #16202C;
    --color-fg: #EAF1F8;
    --color-fg-muted: #93A5B5;
    --color-border-line: #263240;
    --color-accent-strong: #BFD8F2;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background-color: var(--color-bg);
    background-image:
      repeating-linear-gradient(135deg, rgba(43,150,229,0.035) 0px, rgba(43,150,229,0.035) 1px, transparent 1px, transparent 46px),
      repeating-linear-gradient(45deg, rgba(11,42,74,0.03) 0px, rgba(11,42,74,0.03) 1px, transparent 1px, transparent 46px);
    background-attachment: fixed;
    color: var(--color-fg);
    font-family: "Montserrat", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #app { max-width: 1180px; margin: 0 auto; padding: 24px 20px 60px; }
  #app.presenting { max-width: 1400px; }

  header.top {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; margin-bottom: 20px; flex-wrap: wrap;
  }
  header.top h1 { font-size: 22px; margin: 0; color: var(--color-fg); }
  header.top p { margin: 2px 0 0; color: var(--color-fg-muted); font-size: 13px; }
  .last-update { margin: 6px 0 0; font-size: 12px; color: var(--color-fg-muted); display: flex; align-items: center; gap: 6px; }
  .last-update .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--color-green); display: inline-block; }
  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .header-btns { display: flex; gap: 8px; }
  .brand-logos { display: flex; align-items: center; gap: 16px; }
  .logo-badge { height: 30px; width: auto; display: block; }
  .logo-chip { background: #FFFFFF; border-radius: 8px; padding: 6px 10px; display: flex; align-items: center; }
  .logo-chip .logo-badge { height: 26px; }

  .icon-btn {
    display: flex; align-items: center; gap: 6px;
    background: var(--color-panel); color: var(--color-fg); border: 1px solid var(--color-border-line);
    border-radius: 8px; padding: 8px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .icon-btn:hover { background: var(--color-border-line); }
  .icon-btn.active { background: var(--color-navy); color: #fff; border-color: var(--color-navy); }

  .card {
    background: var(--color-panel);
    border: 1px solid var(--color-border-line);
    border-radius: 14px;
    padding: 18px 20px;
  }

  .upload-card { margin-bottom: 22px; overflow: hidden; }
  .upload-card.collapsed { display: none; }
  .upload-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .upload-row input[type="file"] {
    color: var(--color-fg); font-size: 13px; flex: 1; min-width: 220px;
  }
  .upload-row input[type="text"] {
    background: transparent; border: 1px solid var(--color-border-line);

<div id="app">

<script>
(function () {
  "use strict";

  var COLORS = {
    navy: "#0B2A4A", navy2: "#123F6E", teal: "#1C6E8C", blue: "#2E86C1",
    lightblue: "#5DADE2", green: "#1F8A5F", amber: "#E8A33D", coral: "#E15241",
    gray: "#A6ACAF", maroon: "#922B21",
  };
  var NAO_INFORMADA = "REGULADORA NÃO INFORMADA";
  var ANALISTA_NAO_INFORMADO = "ANALISTA NÃO INFORMADO";
  var CONTA_DE_SISTEMA = "CONTA DE SISTEMA";
  var CONTAS_DE_SISTEMA_RAW = ["tarefa.automatica", "adm"];
  var API_REGULATORS = ["Dórica Reguladora", "L Perna", "Fox", "Serra & Company"];
  var STATUS_NAMES = ["Aprovado", "Atrasado", "Em andamento", "Cancelado", "Rejeitado"];
  function sortRegulators(a, b) {
    if (a.label === NAO_INFORMADA) return 1;
    if (b.label === NAO_INFORMADA) return -1;
    return b.value - a.value;
  }
  function catLabel(label, maxLen) {
    var icon = API_REGULATORS.indexOf(label) !== -1 ? "⚡ " : "";
    var txt = label.length > maxLen ? label.slice(0, maxLen - 1) + "…" : label;
    return icon + txt;
  }

  // Transforma "nome.sobrenome" em "Nome Sobrenome" para exibição. Processos com
  // mais de um analista (separados por ";") têm cada nome formatado individualmente.
  // Rótulos especiais (ANALISTA NÃO INFORMADO, CONTA DE SISTEMA) ficam como estão.
  function formatAnalystName(raw) {
    if (raw === ANALISTA_NAO_INFORMADO || raw === CONTA_DE_SISTEMA) return raw;
    return raw.split(";").map(function (part) {
      return part.trim().split(".").map(function (w) {
        return w.length ? w.charAt(0).toUpperCase() + w.slice(1) : w;
      }).join(" ");
    }).join("; ");
  }

  // --------- filtro por clique (drill-down) ---------
  // Clicar numa barra/fatia filtra o painel inteiro para aquele recorte.
  // activeFilter = { dim: "reg"|"analyst"|"origem"|"status"|"statusgroup", value, displayLabel }
  var activeFilter = null;

  // --------- abas: OPERAÇÃO x MÉTRICAS-CHAVE DO CASE ---------
  var activeTab = "operacao";
  var caseDateMode = "golive"; // "tudo" | "antes" | "golive" — período usado nos cálculos da aba Case

  function applyActiveFilter(rowData, regIndex, analystIndex, filter) {
    if (!filter) return rowData;
    return rowData.filter(function (row) {
      if (filter.dim === "reg") return regIndex[row[3]] === filter.value;
      if (filter.dim === "analyst") {
        var name = analystIndex[row[5]];
        if (filter.value === CONTA_DE_SISTEMA) return CONTAS_DE_SISTEMA_RAW.indexOf(String(name).toLowerCase()) !== -1;
        return formatAnalystName(name) === filter.value;
      }
      if (filter.dim === "origem") {
        var code = filter.value === "API" ? 0 : filter.value === "Migração Quiver" ? 1 : 2;
        return row[2] === code;
      }
      if (filter.dim === "status") return STATUS_NAMES[row[1]] === filter.value;
      if (filter.dim === "statusgroup") {
        var isAberto = row[1] === 1 || row[1] === 2;
        return filter.value === "Aberto" ? isAberto : !isAberto;
      }
      return true;
    });
  }

  function setActiveFilter(dim, value, displayLabel) {
    if (activeFilter && activeFilter.dim === dim && activeFilter.value === value) {
      activeFilter = null; // clicar de novo no mesmo item remove o filtro
    } else {
      activeFilter = { dim: dim, value: value, displayLabel: displayLabel || value };
    }
    renderDashboard();
  }

  var labelInput = document.getElementById("labelInput");

  var filterExplain = document.getElementById("filterExplain");
  var sourceBadge = document.getElementById("sourceBadge");
  var exportBtn = document.getElementById("exportBtn");
  var uploadCard = document.getElementById("uploadCard");
  var presentBtn = document.getElementById("presentBtn");
  var lastUpdateEl = document.getElementById("lastUpdate");
  var liveHeader = document.getElementById("liveHeader");
  var exportHeader = document.getElementById("exportHeader");
  var exportMeta = document.getElementById("exportMeta");
  var appEl = document.getElementById("app");

  // ======================================================================
  // CONFIGURACAO DO SUPABASE
  // ======================================================================
  var SUPABASE_URL = "https://hefrjozdghqklaaxzdod.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_tfQfbyqFWhBPbN7vv1ThNA_Un975h17";
  var supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Shim: imita a mesma interface usada no resto do codigo
  // (collection().add / collection().orderBy().limit().get() / collection().doc().delete()),
  // só que por baixo chama o Supabase. Isso evita precisar reescrever toda a
  // logica de upload/leitura/exclusao que já existia.
  function makeSupabaseDbShim(client) {
    function collection(name) {
      return {
        add: function (payload) {
          return client.from(name).insert({
            uploaded_at: payload.uploadedAt,
            data: payload
          }).select().then(function (res) {
            if (res.error) throw res.error;
            return res.data[0];
          });
        },
        orderBy: function (field, dir) {
          return {
            limit: function (n) {
              return {
                get: function () {
                  return client.from(name)
                    .select("*")
                    .order("uploaded_at", { ascending: dir !== "desc" })
                    .limit(n)
                    .then(function (res) {
                      if (res.error) throw res.error;
                      var rows = res.data || [];
                      return {
                        empty: rows.length === 0,
                        docs: rows.map(function (row) {
                          return { id: row.id, data: function () { return row.data; } };
                        })
                      };
                    });
                }
              };
            }
          };
        },
        doc: function (id) {
          return {
            delete: function () {
              return client.from(name).delete().eq("id", id).then(function (res) {
                if (res.error) throw res.error;
              });
            }

  function pickSheet(wb) {
    var names = wb.SheetNames || [];
    var byName = names.find(function (n) { return n.trim().toLowerCase() === "lista"; });
    if (byName) return wb.Sheets[byName];
    for (var i = 0; i < names.length; i++) {
      var sh = wb.Sheets[names[i]];
      var json = XLSX.utils.sheet_to_json(sh, { header: 1, range: 0 });
      if (json && json[0] && json[0].some(function (h) { return String(h).trim() === "Status do Processo"; })) {
        return sh;
      }
    }
    return names.length ? wb.Sheets[names[0]] : null;
  }

  function norm(v) { return (v === null || v === undefined) ? "" : String(v).trim(); }

  function daysSinceEpoch(d) { return Math.floor(d.getTime() / 86400000); }
  function dateFromDays(days) { return new Date(days * 86400000); }
  function daysBack(date, n) { var d = new Date(date); d.setDate(d.getDate() - n); return d; }
  function monthsBack(date, n) { var d = new Date(date); d.setMonth(d.getMonth() - n); return d; }

  // Lê a planilha completa e, além dos totais gerais (para compatibilidade e referência),
  // guarda uma versão compacta linha-a-linha (rowData) para permitir recalcular os
  // indicadores em QUALQUER data de corte, sempre usando a data de ABERTURA do sinistro.
  function computeIndicators(rows) {
    var SEM_CORRESPONDENCIA = "SEM CORRESPONDÊNCIA DIRETA";
    var regIndex = [];
    var regMap = {};
    function regIdxFor(name) {
      if (Object.prototype.hasOwnProperty.call(regMap, name)) return regMap[name];
      var idx = regIndex.length;
      regIndex.push(name);
      regMap[name] = idx;
      return idx;
    }
    var analystIndex = [];
    var analystMap = {};
    function analystIdxFor(name) {
      if (Object.prototype.hasOwnProperty.call(analystMap, name)) return analystMap[name];
      var idx = analystIndex.length;
      analystIndex.push(name);
      analystMap[name] = idx;
      return idx;
    }

    var rowData = [];
    var maxAbertura = null;
    var totalSemAbertura = 0;

    rows.forEach(function (r) {
      var origemRaw = norm(r["Origem do Sinistro"]);
      var origemUpper = origemRaw.toUpperCase();
      var status = norm(r["Status do Processo"]);
      var reguladoraRaw = norm(r["Reguladora"]);

      // A coluna "Origem do Sinistro" já teve dois formatos diferentes:
      // (1) formato antigo — traz o texto genérico "API", e o nome da reguladora
      //     vem separado na coluna "Reguladora";
      // (2) formato novo — traz o NOME DA REGULADORA diretamente, e a coluna
      //     "Reguladora" fica em branco para esses registros.
      // A lógica abaixo reconhece os dois formatos sem quebrar nenhum deles.
      var origemCode; // 0 = API, 1 = Migração Quiver, 2 = Manual
      var reguladoraFinal;
      if (origemUpper === "CARGA HISTORICA") {
        origemCode = 1;
        reguladoraFinal = reguladoraRaw;
      } else if (origemUpper === "API") {
        origemCode = 0;
        reguladoraFinal = reguladoraRaw;
      } else if (!origemRaw || origemUpper === "MANUAL" || origemUpper === "E-MAIL") {
        origemCode = 2;
        reguladoraFinal = reguladoraRaw;
      } else {
        origemCode = 0;
        reguladoraFinal = reguladoraRaw || origemRaw;
      }
      var reguladora = (!reguladoraFinal || reguladoraFinal.toUpperCase() === SEM_CORRESPONDENCIA) ? NAO_INFORMADA : reguladoraFinal;

      var aberturaRaw = r["Abertura"];
      if (!aberturaRaw) { totalSemAbertura++; return; }
      var d = new Date(aberturaRaw);
      if (isNaN(d.getTime())) { totalSemAbertura++; return; }
      if (!maxAbertura || d > maxAbertura) maxAbertura = d;

      var statusCode = STATUS_NAMES.indexOf(status); // -1 se não reconhecido
      var regIdx = regIdxFor(reguladora);
      var analistaRaw = norm(r["Analista Responsável"]);
      var analistaIdx = analystIdxFor(analistaRaw || ANALISTA_NAO_INFORMADO);

      var liquidacaoRaw = r["Data da liquidação"];
      var liqDays = null;
      if (liquidacaoRaw) {
        var dl = new Date(liquidacaoRaw);
        if (!isNaN(dl.getTime())) liqDays = daysSinceEpoch(dl);
      }

      var pagamentoRaw = r["Data do pagamento"] || r["Data de pagamento"] || r["Data de Pagamento"];
      var pagDays = null;
      if (pagamentoRaw) {
        var dp = new Date(pagamentoRaw);
        if (!isNaN(dp.getTime())) pagDays = daysSinceEpoch(dp);
      }

      rowData.push([daysSinceEpoch(d), statusCode, origemCode, regIdx, liqDays, analistaIdx, pagDays]);
    });

    var totals = computeCumulative(rowData, regIndex, analystIndex, Infinity);
    totals.rowData = rowData;
    totals.regIndex = regIndex;
    totals.analystIndex = analystIndex;
    totals.asOfDate = maxAbertura ? maxAbertura.toISOString() : null;
    totals.totalSemAbertura = totalSemAbertura;
    return totals;
  }

  // Recalcula todos os indicadores considerando só os sinistros cuja ABERTURA
  // é menor ou igual ao corte informado (cutoffDays = dias desde epoch, ou Infinity p/ tudo).
  // Também calcula o atraso médio (em dias) dos processos atrasados até a data de corte.
  function computeCumulative(rowData, regIndex, analystIndex, cutoffDays) {
    var total = 0, manual = 0, api = 0, quiver = 0;
    var aberto = 0, encerrado = 0, emAndamento = 0, atrasado = 0, aprovado = 0, cancelado = 0, rejeitado = 0;
    var byRegTotal = {}, byRegAPI = {}, byAnalistaTotal = {}, byAnalistaAberto = {}, byAnalistaEncerrado = {};
    var atrasoDiasSoma = 0, atrasoCount = 0;

    rowData.forEach(function (row) {
      var abDays = row[0], statusCode = row[1], origemCode = row[2], regIdx = row[3], analistaIdx = row[5];
      if (abDays > cutoffDays) return;
      total++;
      if (origemCode === 0) api++; else if (origemCode === 1) quiver++; else manual++;
      var regName = regIndex[regIdx];
      byRegTotal[regName] = (byRegTotal[regName] || 0) + 1;
      if (origemCode === 0) byRegAPI[regName] = (byRegAPI[regName] || 0) + 1;

      var isAberto = statusCode === 1 || statusCode === 2;
      if (analystIndex && analistaIdx !== undefined) {
        var analistaName = analystIndex[analistaIdx];
        byAnalistaTotal[analistaName] = (byAnalistaTotal[analistaName] || 0) + 1;
        if (isAberto) byAnalistaAberto[analistaName] = (byAnalistaAberto[analistaName] || 0) + 1;
        else byAnalistaEncerrado[analistaName] = (byAnalistaEncerrado[analistaName] || 0) + 1;
      }

      if (statusCode === 1) {
        atrasado++; aberto++;
        if (isFinite(cutoffDays)) { atrasoDiasSoma += (cutoffDays - abDays); atrasoCount++; }
      }
      else if (statusCode === 2) { emAndamento++; aberto++; }
      else if (statusCode === 0) { aprovado++; encerrado++; }
      else if (statusCode === 3) { cancelado++; encerrado++; }
      else if (statusCode === 4) { rejeitado++; encerrado++; }
    });

    return {
      total: total, manual: manual, api: api, quiver: quiver,
      aberto: aberto, encerrado: encerrado, emAndamento: emAndamento, atrasado: atrasado,
      aprovado: aprovado, cancelado: cancelado, rejeitado: rejeitado,
      byRegTotal: byRegTotal, byRegAPI: byRegAPI,
      byAnalistaTotal: byAnalistaTotal, byAnalistaAberto: byAnalistaAberto, byAnalistaEncerrado: byAnalistaEncerrado,
      atrasoMedioDias: atrasoCount ? Math.round(atrasoDiasSoma / atrasoCount) : null,
    };
  }

  // Data do Go-Live do Alper Cargo na Lecom — início fixo da série de evolução,
  // independente da data de corte escolhida.
  var GO_LIVE_DATE = new Date("2026-09-23T12:00:00");
  var SHOW_TREND_CARD = false; // card "Evolução desde o Go-Live" ocultado a pedido — mude para true para reativar

  // Reconstrói o estado REAL do processo em uma data passada, usando a data de
  // liquidação (quando existir): um processo só conta como "encerrado" na data de
  // corte se já tinha sido liquidado até aquela data — não só porque está encerrado
  // HOJE. Uploads antigos sem a coluna "Data da liquidação" (linhas com só 4
  // posições) usam o status atual como aproximação, já que não há outra referência.
  function computeHistoricalPoint(rowData, cutoffDays) {
    var total = 0, encerrado = 0, aberto = 0;
    rowData.forEach(function (row) {
      var abDays = row[0], statusCode = row[1], liqDays = row.length > 4 ? row[4] : undefined;
      if (abDays > cutoffDays) return;
      total++;
      if (liqDays !== undefined) {
        if (liqDays !== null && liqDays <= cutoffDays) encerrado++; else aberto++;
      } else {
        var isEncerradoAgora = statusCode === 0 || statusCode === 3 || statusCode === 4;
        if (isEncerradoAgora) encerrado++; else aberto++;
      }
    });
    return { total: total, encerrado: encerrado, aberto: aberto };
  }

  // Série semanal do Go-Live até a data de corte, calculada a partir do MESMO
  // upload via fatiamento por data de abertura/liquidação — não depende de múltiplos uploads.
  function computeTrendSeries(rowData, regIndex, startDate, cutoffDate) {
    var series = [];
    var d = new Date(startDate);
    while (d < cutoffDate) {
      var agg = computeHistoricalPoint(rowData, daysSinceEpoch(d));
      series.push({ label: fmtDateShort(d), total: agg.total, aberto: agg.aberto, encerrado: agg.encerrado });
      d = daysBack(d, -7); // avança 7 dias
    }
    var finalAgg = computeHistoricalPoint(rowData, daysSinceEpoch(cutoffDate));
    series.push({ label: fmtDateShort(cutoffDate), total: finalAgg.total, aberto: finalAgg.aberto, encerrado: finalAgg.encerrado });
    return series;
  }

  // ---------------- rendering ----------------

  function refDate(snapshot) { return snapshot.asOfDate || snapshot.uploadedAt; }

  function setupDateFilterRange() {
    if (!sourceDoc || !Array.isArray(sourceDoc.data.rowData) || !sourceDoc.data.rowData.length) return;
    var days = sourceDoc.data.rowData.map(function (r) { return r[0]; });
    var minD = dateFromDays(Math.min.apply(null, days));
    var maxD = dateFromDays(Math.max.apply(null, days));
    dateFilter.min = minD.toISOString().slice(0, 10);
    dateFilter.max = maxD.toISOString().slice(0, 10);
    if (!dateFilter.value) dateFilter.value = maxD.toISOString().slice(0, 10);
  }

  function showSkeleton() {
    content.innerHTML =
      '<div class="skeleton">' +
      '<div class="skeleton-row">' +
      '<div class="skeleton-box"></div><div class="skeleton-box"></div><div class="skeleton-box"></div><div class="skeleton-box"></div>' +
      '</div>' +
      '<div class="skeleton-row"><div class="skeleton-box tall"></div><div class="skeleton-box tall"></div></div>' +
      '</div>';

  function loadAndRender(db) {
    currentDb = db;
    showSkeleton();
    db.collection("snapshots").orderBy("uploadedAt", "desc").limit(20).get().then(function (snap) {
      processBtn.disabled = !pendingRows;
      if (snap.empty) {
        tabNav.style.display = "none";
        periodBar.style.display = "none";
        toolbarRow.style.display = "none";
        filterExplain.style.display = "none";
        sourceBadge.style.display = "none";
        lastUpdateEl.style.display = "none";
        uploadCard.classList.remove("collapsed");
        content.innerHTML = '<div class="empty-state">' +
          '<div class="big-icon">📁</div>' +
          '<div><strong>Nenhum dado ainda</strong></div>' +
          '<div class="hint">Use o botão "⚙ Atualizar dados" acima para enviar sua primeira planilha.</div>' +
          '</div>';
        return;
      }
      allDocs = snap.docs.map(function (d) { return { id: d.id, data: d.data() }; });

      var withRows = allDocs.filter(function (d) { return Array.isArray(d.data.rowData) && d.data.rowData.length; });
      withRows.sort(function (a, b) { return new Date(b.data.uploadedAt) - new Date(a.data.uploadedAt); });
      sourceDoc = withRows.length ? withRows[0] : null;

      tabNav.style.display = "flex";
      toolbarRow.style.display = "flex";
      compareGroup.style.display = "flex";
      uploadCard.classList.add("collapsed");
      setupDateFilterRange();

      var latest = allDocs[0].data;
      if (latest.uploadedAt) {
        lastUpdateEl.style.display = "flex";
        var uploadedDate = new Date(latest.uploadedAt);
        var uploadedDateOnly = uploadedDate.toLocaleDateString("pt-BR");
        var labelDiffers = latest.label && latest.label.trim() !== uploadedDateOnly;
        lastUpdateEl.querySelector("span:last-child").textContent =
          "Última atualização: " + uploadedDate.toLocaleString("pt-BR") + (labelDiffers ? " (" + latest.label + ")" : "");
      }
      renderDashboard();
    }).catch(function (err) {
      content.innerHTML = '<div class="empty-state">Erro ao carregar histórico: ' + (err && err.message ? err.message : err) + '</div>';
    });
  }

  function fmt(n) { return (n || 0).toLocaleString("pt-BR"); }
  function fmtDate(d) { return d.toLocaleDateString("pt-BR"); }
  function fmtDateShort(d) { return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0"); }

  function deltaHtml(curr, prev, invert) {
    if (prev === undefined || prev === null) {
      return '<div class="delta neutral">— sem período anterior</div>';
    }
    var diff = curr - prev;
    var pct = prev !== 0 ? (diff / prev * 100) : (curr !== 0 ? 100 : 0);
    var arrow = diff > 0 ? "▲" : diff < 0 ? "▼" : "•";
    var kind = "neutral";
    if (diff !== 0 && invert !== null) {
      var better = invert ? diff < 0 : diff > 0;
      kind = better ? "good" : "bad";
    }
    var sign = diff > 0 ? "+" : "";
    return '<div class="delta ' + kind + '">' + arrow + ' ' + sign + fmt(diff) +
      ' (' + sign + pct.toFixed(1) + '%) <span style="color:var(--color-fg-muted); font-weight:500;">vs. anterior</span></div>';
  }

  function buildSummary(current, previous, skipAlertStat) {
    var parts = [];
    if (!skipAlertStat) {
      if (current.aberto > 0) {
        var pctEmDiaAberto = Math.round((current.aberto - current.atrasado) / current.aberto * 100);
        parts.push("Dos processos em aberto, " + fmt(pctEmDiaAberto) + "% estão em dia e " + fmt(100 - pctEmDiaAberto) + "% estão atrasados.");
      } else {
        parts.push("Nenhum processo em aberto no período.");
      }
    }
    if (previous && previous.atrasado !== undefined) {
      var diff = current.atrasado - previous.atrasado;
      if (diff !== 0) {
        var pct = previous.atrasado !== 0 ? Math.abs(diff / previous.atrasado * 100) : 100;
        parts.push((diff > 0 ? "Atenção: atrasados subiram " : "Atrasados caíram ") + pct.toFixed(0) + "% em relação ao período anterior.");
      } else {
        parts.push("Atrasados estáveis em relação ao período anterior.");
      }
    }
    if (current.atrasoMedioDias !== null && current.atrasoMedioDias !== undefined) {
      parts.push("Atraso médio atual: " + current.atrasoMedioDias + " dias.");
    }
    return parts.length ? parts.join(" ") : null;
  }

  var BLOCKED_MSG = "A plataforma Lecom não possui dados que permitam gerar este indicador";

  function caseMetricCard(title, meta, valueHtml, neededNote) {
    var blocked = !valueHtml;
    return '<div class="card case-metric">' +
      '<div class="case-metric-title">' + title + '</div>' +
      (meta ? '<div class="case-metric-meta">Meta: ' + meta + '</div>' : '') +
      (blocked
        ? '<div class="case-blocked">' + BLOCKED_MSG + '.</div>' + (neededNote ? '<div class="case-needed">📋 ' + neededNote + '</div>' : '')
        : '<div class="case-metric-value">' + valueHtml + '</div>') +
      '</div>';
  }

  // Monta a aba "Métricas-chave do Case" — todas as métricas e ganhos do case aprovado
  // (Case SVP Transportes, slides 5 e 6), mesmo as que ainda não têm dado na Lecom.
  // Calcula automação considerando só sinistros ABERTOS DESDE O GO-LIVE (23/09/2026) —
  // a partir dessa data os usuários passaram a operar na plataforma e as reguladoras a
  // enviar por API, então migração histórica (Quiver) não deve entrar nessa conta.
  function computeAutomacao(rowData, rangeStartDays, rangeEndDays) {
    if (!rowData) return null;
    var api = 0, manual = 0;
    rowData.forEach(function (row) {
      var abDays = row[0], origemCode = row[2];
      if (abDays < rangeStartDays || abDays > rangeEndDays) return;
      if (origemCode === 0) api++;
      else if (origemCode !== 1) manual++; // exclui eventual resquicio de migracao (codigo 1)
    });
    var base = api + manual;
    return { api: api, manual: manual, base: base, pct: base > 0 ? Math.round((api / base) * 100) : null };
  }

  // Calcula o SLA medio (Abertura -> Pagamento) dentro do intervalo informado. Enquanto
  // nao houver nenhuma data de pagamento preenchida no intervalo, usa um PROXY
  // provisorio: tempo medio em aberto (abertura -> hoje/data de corte) para os mesmos
  // processos. Assim que existir ao menos 1 pagamento real no intervalo, passa a usar
  // sempre o calculo real (Abertura -> Pagamento).
  function computeSla(rowData, rangeStartDays, rangeEndDays, todayDays) {
    if (!rowData) return null;
    var somaReal = 0, countReal = 0;
    var somaProxy = 0, countProxy = 0;
    rowData.forEach(function (row) {
      var abDays = row[0], pagDays = row[6];
      if (abDays < rangeStartDays || abDays > rangeEndDays) return;
      countProxy++;
      somaProxy += (todayDays - abDays);
      if (pagDays !== undefined && pagDays !== null) {
        var dias = pagDays - abDays;
        if (dias >= 0) { somaReal += dias; countReal++; }
      }
    });
    if (countReal > 0) return { mode: "real", count: countReal, avgDays: Math.round(somaReal / countReal) };
    if (countProxy > 0) return { mode: "proxy", count: countProxy, avgDays: Math.round(somaProxy / countProxy) };
    return null;
  }

  // Filtra rowData pelo modo de período escolhido (compartilhado entre as duas abas):
  // "tudo" nao filtra nada, "antes" so abertura < Go-Live, "golive" so abertura >= Go-Live.
  function applyDateRangeMode(rowData, mode, cutoffDate) {
    if (!rowData || mode === "tudo") return rowData;
    var goDays = daysSinceEpoch(GO_LIVE_DATE);
    var cutDays = daysSinceEpoch(cutoffDate);
    var rangeStart, rangeEnd;
    if (mode === "antes") { rangeStart = -Infinity; rangeEnd = Math.min(goDays - 1, cutDays); }
    else { rangeStart = goDays; rangeEnd = cutDays; } // golive
    return rowData.filter(function (row) { return row[0] >= rangeStart && row[0] <= rangeEnd; });
  }

  // atualiza só o estado visual do bloco fixo "Período de análise" (botão ativo + legenda)
  function updatePeriodBar() {
    document.querySelectorAll("#caseDateGroup [data-mode]").forEach(function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-mode") === caseDateMode);
    });
    periodCaption.textContent = caseDateMode === "antes"
      ? "Sinistros abertos até 22/09/2026 — base migrada do Quiver."
      : caseDateMode === "golive"
      ? "Sinistros abertos a partir de 23/09/2026 — operação na Lecom."
      : "Todos os sinistros (Quiver + Lecom).";
  }

  function renderCaseTab(current, effectiveRowData, cutoffDate) {
    var html = "";
    var goDays = daysSinceEpoch(GO_LIVE_DATE);
    var cutDays = daysSinceEpoch(cutoffDate);
    var rangeStart, rangeEnd, periodoTxt;

      rangeStart = -Infinity;
      rangeEnd = Math.min(goDays - 1, cutDays);
      periodoTxt = "antes do Go-Live (até 22/09/2026)";
    } else if (caseDateMode === "golive") {
      rangeStart = goDays;
      rangeEnd = cutDays;
      periodoTxt = "pós Go-Live (desde 23/09/2026)";
    } else { // tudo
      rangeStart = -Infinity;
      rangeEnd = cutDays;
      periodoTxt = "toda a base (antes e pós Go-Live)";
    }

    html += '<div class="case-header">' +
      '<div class="tag">CASE APROVADO — SVP TRANSPORTES 2026</div>' +
      '<h2>Métricas-chave do projeto Workflow de Sinístros</h2>' +
      '<p>Extraído do case "Squad SVP Transportes — Aprovação de Squad 2026" (fevereiro/2026), slides 5 e 6.</p>' +
      '</div>';

    html += '<div class="section-title">Indicadores-chave</div>';
    html += '<div class="case-grid">';

    // 1) % automacao — unico que temos dado real hoje, via Origem do Sinistro
    var autoCalc = computeAutomacao(effectiveRowData, rangeStart, rangeEnd);
    if (autoCalc && autoCalc.base > 0) {
      var autoOk = autoCalc.pct >= 40;
      html += '<div class="card case-metric" style="grid-column: span 2;">' +
        '<div class="case-metric-title">% de automação (coleta e análise)' + (autoOk ? ' <span class="goal-badge">✅ Meta atingida</span>' : '') + '</div>' +
        '<div class="case-metric-meta">Meta: 40% · ' + periodoTxt + '</div>' +
        '<div class="case-automacao-breakdown">' +
        '<div class="case-mini-stat"><span class="n">' + fmt(autoCalc.base) + '</span><span class="l">Total abertos</span></div>' +
        '<div class="case-mini-stat"><span class="n">' + fmt(autoCalc.api) + '</span><span class="l">Via API</span></div>' +
        '<div class="case-mini-stat"><span class="n">' + fmt(autoCalc.manual) + '</span><span class="l">Manual</span></div>' +
        '</div>' +
        '<div class="case-metric-value case-automacao-pct' + (autoOk ? ' goal-hit' : '') + '">' + autoCalc.pct + '%</div>' +
        '</div>';
    } else {
      html += caseMetricCard("% de automação (coleta e análise)", "40%", null,
        "Nenhum processo encontrado " + periodoTxt + " no período selecionado para calcular.");
    }

    // 2) Reducao de custo da area — bloqueado (dado de RH)
    html += caseMetricCard("Redução de custo da área", "-29,03%", null,
      "Precisa de headcount e salário bruto por cargo (RH).");

    // 3) SLA Abertura -> Pagamento — real quando houver pagamentos; proxy (tempo em
    // aberto) enquanto não houver nenhum
    var slaCalc = computeSla(effectiveRowData, rangeStart, rangeEnd, cutDays);
    if (slaCalc && slaCalc.mode === "real") {
      html += '<div class="card case-metric">' +
        '<div class="case-metric-title">SLA do sinistro (Abertura → Pagamento)</div>' +
        '<div class="case-metric-meta">Meta: Redução do tempo total · ' + periodoTxt + '</div>' +
        '<div class="case-metric-value">' + slaCalc.avgDays + ' dias</div>' +
        '<div class="case-sub">Média sobre ' + fmt(slaCalc.count) + ' processos já pagos no período</div>' +
        '</div>';
    } else if (slaCalc && slaCalc.mode === "proxy") {
      html += '<div class="card case-metric">' +
        '<div class="case-metric-title">SLA do sinistro (Abertura → Pagamento)</div>' +
        '<div class="case-metric-meta">Meta: Redução do tempo total · ' + periodoTxt + '</div>' +
        '<div class="case-metric-value">' + slaCalc.avgDays + ' dias</div>' +
        '<div class="case-sub">⚠️ Proxy provisório: ainda sem nenhuma data de pagamento preenchida — mostrando o tempo médio em aberto (abertura até hoje) de ' + fmt(slaCalc.count) + ' processos. Assim que houver pagamentos registrados, passa a usar o cálculo real.</div>' +
        '</div>';
    } else {
      html += caseMetricCard("SLA do sinistro (Abertura → Pagamento)", "Redução do tempo total", null,
        "Nenhum processo encontrado " + periodoTxt + " no período selecionado para calcular.");
    }

    // 4) NPS — bloqueado (pesquisa externa)
    html += caseMetricCard("NPS da nova interface", ">40 no ano 1 · 55+ em 3 anos", null,
      "Precisa de pesquisa de satisfação externa (ex.: Typeform, Qualtrics) — não existe no Lecom.");

    // 5) Custo hora/homem por processo — bloqueado (falta parte do RH)
    html += caseMetricCard("Custo (hora/homem) por processo aberto", "Redução de custo por sinistro", null,
      "O volume por analista já existe na aba Operação; falta o salário por pessoa (RH) para calcular o custo.");

    html += '</div>';

    html += '<div class="section-title">Ganhos e captura de valor (3 anos)</div>';
    html += '<div class="case-grid-2">';
    html += caseMetricCard("Captura de valor — Eficiência Operacional", "R$ 1.141.953,12 em 3 anos", null,
      "Calculado a partir de dados de headcount e salário bruto (RH), não do Lecom.");
    html += caseMetricCard("Satisfação e Retenção (NPS)", ">40 (ano 1) · 55+ (3 anos)", null,
      "Mesma pendência do indicador de NPS acima — requer pesquisa de satisfação externa.");
    html += '</div>';
    html += '<div class="case-source-note">Fonte: Case SVP Transportes — Aprovação de Squad 2026, slides 5 ("Métricas-chave" e "Ganhos identificados") e 6 ("Zoom — Captura de Valor").</div>';

    html += '<div class="section-title">Checklist — dados fora da Lecom pendentes de captura</div>';
    html += '<div class="card case-checklist">' +
      '<div class="checklist-item"><span class="checklist-box">☐</span><div><strong>Dados de RH</strong> (headcount por cargo + salário bruto) <span class="checklist-activates">ativa: Redução de custo da área · Custo por sinistro · Captura de valor</span></div></div>' +
      '<div class="checklist-item"><span class="checklist-box">☐</span><div><strong>Pesquisa de satisfação</strong> (ferramenta de NPS, ex.: Typeform, Qualtrics) <span class="checklist-activates">ativa: NPS da nova interface · Satisfação e Retenção</span></div></div>' +
      '</div>';

    return html;
  }

  function renderDashboard() {
    var current, previous, cutoffDate, previousCutoffDate;

    if (sourceDoc) {
      cutoffDate = dateFilter.value ? new Date(dateFilter.value + "T12:00:00") : dateFromDays(Math.max.apply(null, sourceDoc.data.rowData.map(function (r) { return r[0]; })));
      var curDays = daysSinceEpoch(cutoffDate);
      var effectiveRowData = applyActiveFilter(sourceDoc.data.rowData, sourceDoc.data.regIndex, sourceDoc.data.analystIndex, activeFilter);
      var operacaoRowData = applyDateRangeMode(effectiveRowData, caseDateMode, cutoffDate);
      current = computeCumulative(operacaoRowData, sourceDoc.data.regIndex, sourceDoc.data.analystIndex, curDays);

      var mode = compareSelect.value || "1d";
      previousCutoffDate = mode === "7d" ? daysBack(cutoffDate, 7) : mode === "30d" ? monthsBack(cutoffDate, 1) : mode === "365d" ? monthsBack(cutoffDate, 12) : daysBack(cutoffDate, 1);
      var prevDays = daysSinceEpoch(previousCutoffDate);
      previous = computeCumulative(operacaoRowData, sourceDoc.data.regIndex, sourceDoc.data.analystIndex, prevDays);

      filterExplain.style.display = "block";
      filterExplain.textContent = "Mostrando sinistros com abertura até " + fmtDate(cutoffDate) +
        "  •  Comparando com sinistros com abertura até " + fmtDate(previousCutoffDate);
    } else if (allDocs.length) {
      current = allDocs[0].data;
      previous = null;
      filterExplain.style.display = "none";
      sourceBadge.style.display = "none";
    } else {
      return;
    }

    if (activeTab === "case") {
      toolbarRow.style.display = "none";

    periodBar.style.display = "block";
    periodBar.classList.remove("standalone");
    updatePeriodBar();

    var html = "";

    // aviso de dados desatualizados (mais de 7 dias desde o último upload)
    var latestUpload = allDocs[0] && allDocs[0].data.uploadedAt ? new Date(allDocs[0].data.uploadedAt) : null;
    if (latestUpload) {
      var diasSemAtualizar = Math.floor((Date.now() - latestUpload.getTime()) / 86400000);
      if (diasSemAtualizar > 7) {

    // alerta de taxa crítica de atraso — calculado antes do resumo para evitar repetir o mesmo dado
    var atrasoRate = current.aberto > 0 ? (current.atrasado / current.aberto) : 0;

    // resumo executivo automático — quando o alerta crítico já aparece, o resumo não repete

    var summaryText = buildSummary(current, previous, showAlert);

    html += kpiCard("Em aberto", current.aberto, previous && previous.aberto, null, false, "📂", COLORS.amber);
    html += kpiCard("Atrasados", current.atrasado, previous && previous.atrasado, true, false, "⏱", COLORS.coral);
    html += kpiCard("Encerrados", current.encerrado, previous && previous.encerrado, false, false, "✅", COLORS.green);
    html += kpiCard("Atraso médio (dias)", current.atrasoMedioDias, previous && previous.atrasoMedioDias, true, true, "📅", COLORS.maroon, "Média de dias em atraso dos processos que estão atrasados HOJE (na data de corte escolhida), contando a partir da data de abertura de cada um.");
    html += "</div>";

    // resumo executivo e alerta de atraso

    if (showAlert) {

        '<strong>' + fmt(current.atrasado) + ' processos atrasados</strong> — ' +

    // legenda de cores — logo antes dos gráficos que usam essas cores

      '<span class="item"><span class="dot" style="background:' + COLORS.navy + ';"></span>Total / neutro</span>' +

    html += '</div>';

    // tendência — calculada por fatiamento de data, não depende de múltiplos uploads

    html += '<div class="card"><div class="table-scroll"><table class="history"><thead><tr><th>Rótulo</th><th>Linhas</th><th>Enviado em</th><th></th></tr></thead><tbody>';
    allDocs.forEach(function (d) {
      var r = d.data;

      html += '<tr class="' + (sourceDoc && d.id === sourceDoc.id ? "current" : "") + '">' +

    if (addDataBtn) {

        uploadCard.classList.toggle("collapsed");
        if (!uploadCard.classList.contains("collapsed")) uploadCard.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }

    var analystFilterGroup = document.getElementById("analystFilterGroup");
    if (analystFilterGroup) {
      analystFilterGroup.querySelectorAll("[data-filter]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          analystFilter = btn.getAttribute("data-filter");
          renderDashboard();
        });
      });
    }

    document.querySelectorAll("[data-del-id]").forEach(function (btn) {
      var confirming = false;
      var resetTimer = null;
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-del-id");
        if (!currentDb) return;
        if (!confirming) {
          confirming = true;
          btn.textContent = "Confirmar exclusão?";
          btn.title = "Clique de novo para confirmar";
          btn.style.color = "var(--color-coral)";
          btn.style.fontWeight = "700";
          btn.style.fontSize = "11.5px";
          resetTimer = setTimeout(function () {
            confirming = false;
            btn.textContent = "🗑";
            btn.style.color = "";
            btn.style.fontWeight = "";
            btn.style.fontSize = "";
          }, 4000);
          return;
        }
        clearTimeout(resetTimer);
        btn.disabled = true;
        btn.textContent = "Excluindo…";
        currentDb.collection("snapshots").doc(id).delete().then(function () {
          dateFilter.value = "";
          loadAndRender(currentDb);
        }).catch(function (err) {
          setStatus("Erro ao excluir: " + (err && err.message ? err.message : err), "err");
          btn.disabled = false;
          btn.textContent = "🗑";
        });
      });
    });

    // draw charts
    drawDonut("#chart-tipo", [
      { label: "Manual", value: current.manual, color: COLORS.gray },
      { label: "API", value: current.api, color: COLORS.teal },
      { label: "Migração Quiver", value: current.quiver, color: COLORS.navy },
    ], { filterDim: "origem", onClick: function (label) { setActiveFilter("origem", label, label); } });

    function gradient(n, c1, c2) {
      var interp = d3.interpolateRgb(c1, c2);
      var out = [];
      for (var i = 0; i < n; i++) out.push(interp(n <= 1 ? 0 : i / (n - 1)));
      return out;
    }

    var apiEntries = Object.keys(current.byRegAPI || {}).map(function (k) {
      return { label: k, value: current.byRegAPI[k] };
    }).sort(sortRegulators);
    var apiColors = gradient(apiEntries.length, COLORS.navy, COLORS.lightblue);
    apiEntries.forEach(function (e, i) { e.color = e.label === NAO_INFORMADA ? COLORS.amber : apiColors[i]; });
    drawBars("#chart-api", apiEntries, { horizontal: apiEntries.length > 5, filterDim: "reg", onClick: function (label) { setActiveFilter("reg", label, label); } });

    drawDonut("#chart-status", [
      { label: "Aberto", value: current.aberto, color: COLORS.amber },
      { label: "Encerrado", value: current.encerrado, color: COLORS.green },
    ], { filterDim: "statusgroup", onClick: function (label) { setActiveFilter("statusgroup", label, label); } });

    drawBars("#chart-detalhado", [
      { label: "Em andamento", value: current.emAndamento, color: COLORS.amber },
      { label: "Atrasado", value: current.atrasado, color: COLORS.coral },
      { label: "Aprovado", value: current.aprovado, color: COLORS.green },
      { label: "Cancelado", value: current.cancelado, color: COLORS.gray },
      { label: "Rejeitado", value: current.rejeitado, color: COLORS.maroon },
    ], { horizontal: false, groupSplit: 2, groupLabels: ["EM ABERTO", "ENCERRADO"], filterDim: "status", onClick: function (label) { setActiveFilter("status", label, label); } });

    allRegulatorEntries = Object.keys(current.byRegTotal || {}).map(function (k) {
      return { label: k, value: current.byRegTotal[k] };
    }).sort(sortRegulators);
    var gradColors = gradient(allRegulatorEntries.length, COLORS.navy, "#CFE5F7");
    allRegulatorEntries.forEach(function (e, i) { e.color = e.label === NAO_INFORMADA ? COLORS.amber : gradColors[i]; });
    drawRegulatorChart();

    allAnalystEntries = (function () {
      var source = analystFilter === "aberto" ? current.byAnalistaAberto
        : analystFilter === "encerrado" ? current.byAnalistaEncerrado
        : current.byAnalistaTotal;
      var raw = Object.assign({}, source || {});
      var sistemaBreakdown = {};
      var sistemaTotal = 0;
      CONTAS_DE_SISTEMA_RAW.forEach(function (rawKey) {
        Object.keys(raw).forEach(function (k) {
          if (k.toLowerCase() === rawKey) {
            sistemaBreakdown[k] = raw[k];
            sistemaTotal += raw[k];
            delete raw[k];
          }
        });
      });
      var entries = Object.keys(raw).map(function (k) { return { label: formatAnalystName(k), value: raw[k] }; });
      if (sistemaTotal > 0) {
        var tooltipTxt = CONTA_DE_SISTEMA + ": " + fmt(sistemaTotal) + " (" +
          Object.keys(sistemaBreakdown).map(function (k) { return k + ": " + fmt(sistemaBreakdown[k]); }).join(", ") + ")";
        entries.push({ label: CONTA_DE_SISTEMA, value: sistemaTotal, tooltip: tooltipTxt });
      }
      return entries;
    })().sort(function (a, b) {
      var aSpecial = a.label === ANALISTA_NAO_INFORMADO || a.label === CONTA_DE_SISTEMA;
      var bSpecial = b.label === ANALISTA_NAO_INFORMADO || b.label === CONTA_DE_SISTEMA;
      if (aSpecial && !bSpecial) return 1;
      if (bSpecial && !aSpecial) return -1;
      if (aSpecial && bSpecial) return a.label === CONTA_DE_SISTEMA ? -1 : 1; // sistema antes de não informado
      return b.value - a.value;
    });
    var analystColors = gradient(allAnalystEntries.length, COLORS.navy2, "#CFE5F7");
    allAnalystEntries.forEach(function (e, i) { e.color = (e.label === ANALISTA_NAO_INFORMADO || e.label === CONTA_DE_SISTEMA) ? COLORS.amber : analystColors[i]; });
    drawAnalystChart();

    if (sourceDoc && SHOW_TREND_CARD) {
      if (cutoffDate < GO_LIVE_DATE) {
        d3.select("#chart-trend").append("div")
          .style("color", "var(--color-fg-muted)").style("font-size", "12px")
          .text("Esta base ainda não tem sinistros com abertura após o Go-Live (23/09/2026) — última abertura registrada: " + fmtDate(dateFromDays(Math.max.apply(null, sourceDoc.data.rowData.map(function (r) { return r[0]; })))) + ".");
      } else {
        var series = computeTrendSeries(effectiveRowData, sourceDoc.data.regIndex, GO_LIVE_DATE, cutoffDate);
        drawTrend("#chart-trend", series);
      }
    }
  }

  function drawRegulatorChart() {
    var full = showAllRegulators;
    var shown = full ? allRegulatorEntries : allRegulatorEntries.slice(0, 10);
    drawBars("#chart-top", shown, { horizontal: true, filterDim: "reg", onClick: function (label) { setActiveFilter("reg", label, label); } });
    var toggleBtn = document.getElementById("regToggleBtn");
    if (toggleBtn) {
      toggleBtn.style.display = allRegulatorEntries.length > 10 ? "inline-block" : "none";
      toggleBtn.textContent = (full ? "▴ Mostrar top 10" : "▾ Mostrar todas (" + allRegulatorEntries.length + ")");
      toggleBtn.onclick = function () {
        showAllRegulators = !showAllRegulators;
        drawRegulatorChart();
      };
    }
  }

  function drawAnalystChart() {
    var full = showAllAnalysts;
    var shown = full ? allAnalystEntries : allAnalystEntries.slice(0, 10);
    drawBars("#chart-analista", shown, { horizontal: true, filterDim: "analyst", onClick: function (label) { setActiveFilter("analyst", label, label); } });
    var toggleBtn = document.getElementById("analystToggleBtn");
    if (toggleBtn) {
      toggleBtn.style.display = allAnalystEntries.length > 10 ? "inline-block" : "none";
      toggleBtn.textContent = (full ? "▴ Mostrar top 10" : "▾ Mostrar todas (" + allAnalystEntries.length + ")");
      toggleBtn.onclick = function () {
        showAllAnalysts = !showAllAnalysts;
        drawAnalystChart();
      };

  function kpiCard(label, curr, prev, invert, isDaysMetric, icon, iconColor, tooltip) {
    var hasVal = curr !== null && curr !== undefined;
    var displayVal = hasVal ? (isDaysMetric ? curr : fmt(curr)) : "—";
    return '<div class="kpi">' +
      '<div class="kpi-icon" style="color:' + (iconColor || COLORS.navy) + ';">' + (icon || "📊") + '</div>' +
      '<div class="kpi-body">' +
      '<div class="label">' + label + (tooltip ? ' <span class="info-dot" data-tip="' + tooltip + '">?</span>' : '') + '</div>' +
      '<div class="value"' + (hasVal ? ' data-target="' + curr + '"' : '') + '>' + (hasVal ? "0" : displayVal) + '</div>' +
      (curr === null || curr === undefined ? '<div class="delta neutral">sem atrasados no período</div>' : deltaHtml(curr, prev, invert)) +
      '</div></div>';
  }

  // conta de 0 até o valor final de cada KPI, para dar sensação de movimento ao carregar
  function animateCounters() {
    document.querySelectorAll(".kpi .value[data-target]").forEach(function (el) {
      var target = parseFloat(el.getAttribute("data-target"));
      if (isNaN(target)) return;
      var start = null;
      var duration = 700;
      function step(ts) {
        if (!start) start = ts;
        var progress = Math.min((ts - start) / duration, 1);
        var eased = 1 - Math.pow(1 - progress, 3);
        var current = Math.round(target * eased);
        el.textContent = fmt(current);
        if (progress < 1) requestAnimationFrame(step);
        else el.textContent = fmt(target);
      }
      requestAnimationFrame(step);
    });
  }

  // -------- simple D3 chart helpers --------

  function chartWidth(sel) {
    var node = d3.select(sel).node();
    var w = node && node.clientWidth ? node.clientWidth : 420;
    return Math.max(260, w);
  }

  function addSrTitle(svg, text) {
    svg.insert("title", ":first-child").text(text);
    svg.attr("role", "img").attr("aria-label", text);
  }

  function drawBars(sel, entries, opts) {
    opts = opts || {};
    var container = d3.select(sel);
    container.selectAll("*").remove();
    if (!entries.length) { container.append("div").style("color", "var(--color-fg-muted)").style("font-size", "12px").text("Sem dados."); return; }

    var W = chartWidth(sel);
    var horizontal = !!opts.horizontal;
    var hasGroups = !horizontal && opts.groupSplit && opts.groupLabels;
    var margin = horizontal
      ? { top: 6, right: 44, bottom: 6, left: Math.min(150, W * 0.32) }
      : { top: hasGroups ? 40 : 22, right: 10, bottom: 28, left: 10 };
    var barThickness = horizontal ? 24 : 0;
    var H = horizontal ? entries.length * (barThickness + 14) + margin.top + margin.bottom : 220 + (hasGroups ? 18 : 0);

    var svg = container.append("svg").attr("viewBox", "0 0 " + W + " " + H);
    addSrTitle(svg, entries.map(function (d) { return d.label + ": " + fmt(d.value); }).join("; "));
    var innerW = W - margin.left - margin.right;
    var innerH = H - margin.top - margin.bottom;
    var g = svg.append("g").attr("transform", "translate(" + margin.left + "," + margin.top + ")");

    var maxVal = d3.max(entries, function (d) { return d.value; }) || 1;
    var clickable = !!opts.onClick;
    function isActive(d) { return activeFilter && opts.filterDim === activeFilter.dim && d.label === activeFilter.value; }

    if (horizontal) {
      var y = d3.scaleBand().domain(entries.map(function (d) { return d.label; })).range([0, innerH]).padding(0.28);
      var x = d3.scaleLinear().domain([0, maxVal]).range([0, innerW]);
      var rects = g.selectAll("rect").data(entries).enter().append("rect")
        .attr("y", function (d) { return y(d.label); })
        .attr("x", 0).attr("height", y.bandwidth())
        .attr("width", 0)
        .attr("rx", 3)
        .attr("fill", function (d) { return d.color; })
        .attr("stroke", function (d) { return isActive(d) ? "var(--color-fg)" : "none"; })
        .attr("stroke-width", function (d) { return isActive(d) ? 2 : 0; })
        .style("opacity", function (d) { return (activeFilter && !isActive(d) && opts.filterDim === activeFilter.dim) ? 0.4 : 1; })
        .classed("clickable-el", clickable);
      if (clickable) rects.on("click", function (event, d) { opts.onClick(d.label); });
      rects.append("title").text(function (d) { return d.tooltip || (d.label + ": " + fmt(d.value)); });
      rects.transition().duration(650).delay(function (d, i) { return i * 35; }).ease(d3.easeCubicOut)
        .attr("width", function (d) { return x(d.value); });
      g.selectAll(".lbl").data(entries).enter().append("text")
        .attr("class", "bar-label")
        .attr("y", function (d) { return y(d.label) + y.bandwidth() / 2 + 4; })
        .attr("x", 8)
        .style("opacity", 0)
        .text(function (d) { return fmt(d.value); })
        .transition().duration(300).delay(function (d, i) { return i * 35 + 500; })
        .style("opacity", 1)
        .attr("x", function (d) { return x(d.value) + 8; });
      g.selectAll(".cat").data(entries).enter().append("text")
        .attr("class", "axis-cat")
        .attr("y", function (d) { return y(d.label) + y.bandwidth() / 2 + 4; })
        .attr("x", -8).attr("text-anchor", "end")
        .style("font-weight", function (d) { return API_REGULATORS.indexOf(d.label) !== -1 ? "700" : "400"; })
        .classed("clickable-el", clickable)
        .text(function (d) { return catLabel(d.label, 20); })
        .on("click", clickable ? function (event, d) { opts.onClick(d.label); } : null)
        .append("title").text(function (d) { return d.tooltip || (d.label + (API_REGULATORS.indexOf(d.label) !== -1 ? " — integração via API" : "")); });
    } else {
      var x2 = d3.scaleBand().domain(entries.map(function (d) { return d.label; })).range([0, innerW]).padding(0.32);
      var y2 = d3.scaleLinear().domain([0, maxVal * 1.15]).range([innerH, 0]);
      var rects2 = g.selectAll("rect").data(entries).enter().append("rect")
        .attr("x", function (d) { return x2(d.label); })
        .attr("y", innerH)
        .attr("width", x2.bandwidth())
        .attr("height", 0)
        .attr("rx", 4)
        .attr("fill", function (d) { return d.color; })
        .attr("stroke", function (d) { return isActive(d) ? "var(--color-fg)" : "none"; })
        .attr("stroke-width", function (d) { return isActive(d) ? 2 : 0; })
        .style("opacity", function (d) { return (activeFilter && !isActive(d) && opts.filterDim === activeFilter.dim) ? 0.4 : 1; })
        .classed("clickable-el", clickable);
      if (clickable) rects2.on("click", function (event, d) { opts.onClick(d.label); });
      rects2.append("title").text(function (d) { return d.tooltip || (d.label + ": " + fmt(d.value)); });
      rects2.transition().duration(650).delay(function (d, i) { return i * 60; }).ease(d3.easeCubicOut)
        .attr("y", function (d) { return y2(d.value); })
        .attr("height", function (d) { return innerH - y2(d.value); });
      g.selectAll(".lbl").data(entries).enter().append("text")
        .attr("class", "bar-label").attr("text-anchor", "middle")
        .attr("x", function (d) { return x2(d.label) + x2.bandwidth() / 2; })
        .attr("y", innerH - 8)
        .style("opacity", 0)
        .text(function (d) { return fmt(d.value); })
        .transition().duration(300).delay(function (d, i) { return i * 60 + 500; })
        .style("opacity", 1)
        .attr("y", function (d) { return y2(d.value) - 8; });
      g.selectAll(".cat").data(entries).enter().append("text")
        .attr("class", "axis-cat").attr("text-anchor", "middle")
        .attr("x", function (d) { return x2(d.label) + x2.bandwidth() / 2; })
        .attr("y", innerH + 18)
        .text(function (d) { return d.label.length > 14 ? d.label.slice(0, 13) + "…" : d.label; });

      if (hasGroups) {
        var split = opts.groupSplit;
        var g1 = entries.slice(0, split), g2 = entries.slice(split);
        var g1Center = d3.mean(g1, function (d) { return x2(d.label) + x2.bandwidth() / 2; });
        var g2Center = d3.mean(g2, function (d) { return x2(d.label) + x2.bandwidth() / 2; });
        var dividerX = (x2(g1[g1.length - 1].label) + x2.bandwidth() + x2(g2[0].label)) / 2;
        g.append("line")
          .attr("x1", dividerX).attr("x2", dividerX)
          .attr("y1", -28).attr("y2", innerH)
          .attr("stroke", "var(--color-border-line)").attr("stroke-dasharray", "3,3");
        g.append("text").attr("x", g1Center).attr("y", -18).attr("text-anchor", "middle")
          .style("font-size", "10.5px").style("font-weight", "700").style("letter-spacing", ".04em")
          .attr("fill", COLORS.amber).text(opts.groupLabels[0]);
        g.append("text").attr("x", g2Center).attr("y", -18).attr("text-anchor", "middle")
          .style("font-size", "10.5px").style("font-weight", "700").style("letter-spacing", ".04em")
          .attr("fill", COLORS.green).text(opts.groupLabels[1]);
      }
    }
  }

  function drawDonut(sel, entries, opts) {
    opts = opts || {};
    var container = d3.select(sel);
    container.selectAll("*").remove();
    var total = d3.sum(entries, function (d) { return d.value; });
    if (!total) { container.append("div").style("color", "var(--color-fg-muted)").style("font-size", "12px").text("Sem dados."); return; }

    var W = chartWidth(sel);
    var H = 200;
    var radius = Math.min(W, H - 34) / 2 - 4;

    var svg = container.append("svg").attr("viewBox", "0 0 " + W + " " + H);
    addSrTitle(svg, entries.map(function (d) { return d.label + ": " + fmt(d.value); }).join("; "));
    var g = svg.append("g").attr("transform", "translate(" + W / 2 + "," + (H / 2 - 12) + ")");

    var pie = d3.pie().value(function (d) { return d.value; }).sort(null);
    var arc = d3.arc().innerRadius(radius * 0.58).outerRadius(radius);
    var clickable = !!opts.onClick;
    function isActive(d) { return activeFilter && opts.filterDim === activeFilter.dim && d.data.label === activeFilter.value; }

    var paths = g.selectAll("path").data(pie(entries)).enter().append("path")
      .attr("fill", function (d) { return d.data.color; })
      .attr("stroke", "var(--color-panel)")
      .attr("stroke-width", 2)
      .style("opacity", function (d) { return (activeFilter && !isActive(d) && opts.filterDim === activeFilter.dim) ? 0.4 : 1; })
      .classed("clickable-el", clickable);
    if (clickable) paths.on("click", function (event, d) { opts.onClick(d.data.label); });
    paths.append("title").text(function (d) { return d.data.label + ": " + fmt(d.data.value); });
    paths.transition().duration(700).ease(d3.easeCubicOut)
      .attrTween("d", function (d) {
        var interp = d3.interpolate({ startAngle: 0, endAngle: 0 }, d);
        return function (t) { return arc(interp(t)); };
      });

    g.selectAll(".val").data(pie(entries)).enter().append("text")
      .attr("transform", function (d) { return "translate(" + arc.centroid(d) + ")"; })
      .attr("text-anchor", "middle")
      .attr("fill", "#fff")
      .style("font-size", "12px").style("font-weight", "700")
      .style("pointer-events", "none")
      .style("opacity", 0)
      .text(function (d) { return (d.data.value / total * 100) >= 4 ? fmt(d.data.value) : ""; })
      .transition().duration(300).delay(500)
      .style("opacity", 1);

    var legend = svg.append("g").attr("transform", "translate(" + (W / 2) + "," + (H - 14) + ")");
    var lx = 0;
    var items = entries.map(function (e) { return e.label + " (" + fmt(e.value) + ")"; });
    var widths = items.map(function (t) { return t.length * 6 + 26; });
    var totalWidth = d3.sum(widths);
    var startX = -totalWidth / 2;
    entries.forEach(function (e, i) {
      var grp = legend.append("g").attr("transform", "translate(" + (startX + lx) + ",0)")
        .classed("clickable-el", clickable);
      if (clickable) grp.on("click", function () { opts.onClick(e.label); });
      grp.append("rect").attr("width", 9).attr("height", 9).attr("y", -8).attr("rx", 2).attr("fill", e.color);
      grp.append("text").attr("class", "legend-item").attr("x", 13).text(items[i]);
      lx += widths[i];
    });
  }

  function drawTrend(sel, series) {
    var container = d3.select(sel);
    container.selectAll("*").remove();
    if (series.length < 2) { container.append("div").style("color", "var(--color-fg-muted)").style("font-size", "12px").text("Dados insuficientes para traçar evolução."); return; }

    var W = chartWidth(sel);
    var H = 240;
    var margin = { top: 16, right: 16, bottom: 28, left: 40 };
    var innerW = W - margin.left - margin.right;
    var innerH = H - margin.top - margin.bottom;

    var svg = container.append("svg").attr("viewBox", "0 0 " + W + " " + H);
    addSrTitle(svg, "Evolução de total, encerrados e em aberto desde o Go-Live, em " + series.length + " pontos semanais.");
    var g = svg.append("g").attr("transform", "translate(" + margin.left + "," + margin.top + ")");

    var x = d3.scalePoint().domain(series.map(function (d) { return d.label; })).range([0, innerW]).padding(0.5);
    var maxY = d3.max(series, function (d) { return Math.max(d.total, d.aberto, d.encerrado); }) || 1;
    var y = d3.scaleLinear().domain([0, maxY * 1.1]).range([innerH, 0]);

    var xAxisG = g.append("g").attr("transform", "translate(0," + innerH + ")")
      .call(d3.axisBottom(x).tickSize(0));
    xAxisG.select(".domain").attr("stroke", "var(--color-border-line)");
    xAxisG.selectAll("text").attr("class", "axis-cat");

    var yAxisG = g.append("g").call(d3.axisLeft(y).ticks(4).tickSize(-innerW));
    yAxisG.select(".domain").remove();
    yAxisG.selectAll("line").attr("stroke", "var(--color-border-line)").attr("stroke-dasharray", "2,3");
    yAxisG.selectAll("text").attr("class", "axis-label");

    var lines = [
      { key: "total", color: COLORS.navy, name: "Total" },
      { key: "encerrado", color: COLORS.green, name: "Encerrados" },
      { key: "aberto", color: COLORS.amber, name: "Em aberto" },
    ];
    lines.forEach(function (ln) {
      var lineGen = d3.line().x(function (d) { return x(d.label); }).y(function (d) { return y(d[ln.key]); });
      g.append("path").datum(series).attr("d", lineGen)
        .attr("fill", "none").attr("stroke", ln.color).attr("stroke-width", 2.5);
      g.selectAll(".pt-" + ln.key).data(series).enter().append("circle")
        .attr("cx", function (d) { return x(d.label); }).attr("cy", function (d) { return y(d[ln.key]); })
        .attr("r", 3.5).attr("fill", ln.color)
        .append("title").text(function (d) { return ln.name + " (semana de " + d.label + "): " + fmt(d[ln.key]); });
    });

    var legend = svg.append("g").attr("transform", "translate(" + margin.left + "," + (H - 4) + ")");
    var lx = 0;
    lines.forEach(function (ln) {
      var grp = legend.append("g").attr("transform", "translate(" + lx + ",0)");
      grp.append("rect").attr("width", 9).attr("height", 9).attr("y", -9).attr("rx", 2).attr("fill", ln.color);
      grp.append("text").attr("class", "legend-item").attr("x", 13).text(ln.name);
      lx += ln.name.length * 6.5 + 32;
    });
  }

  // -------- boot --------
  dbPromise.then(function (db) {
    if (!db) {
      content.innerHTML = '<div class="empty-state">Sem permissão de leitura/escrita neste momento. Faça upload para ver os indicadores desta sessão (sem histórico salvo).</div>';
      return;
    }
    loadAndRender(db);
  });
})();
</script>
</body>
</html>
